<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SomControl v18</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--surface:#18181f;--surface2:#1e1e28;--surface3:#252533;
  --border:#2a2a3a;--border2:#35354a;
  --txt:#f0f0f8;--txt2:#9090b8;--txt3:#5a5a80;
  --blue:#4f8ef7;--green:#22d3a5;--amber:#f59e0b;--red:#ef4444;--purple:#a78bfa;
}
body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px}
.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:36px 32px;width:100%;max-width:360px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .name{font-size:22px;font-weight:800;color:var(--txt);margin-bottom:4px}
.login-logo .sub{font-size:12px;color:var(--txt3)}
.login-box label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:5px}
.login-box input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--txt);font-family:inherit;outline:none;margin-bottom:14px}
.login-box input:focus{border-color:var(--blue)}
.login-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.login-btn:hover{opacity:.9}
.login-err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:14px;display:none}
#app{display:none;flex:1;overflow:hidden}
#app.visible{display:flex}
#sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
#sidebar-logo .name{font-size:15px;font-weight:800;color:var(--txt)}
#sidebar-logo .sub{font-size:11px;color:var(--txt3);margin-top:2px}
#sidebar-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--txt2);font-size:13px;font-weight:600;margin-bottom:2px;transition:all .15s}
.nav-item:hover{background:var(--surface2);color:var(--txt)}
.nav-item.active{background:var(--surface3);color:var(--blue)}
.nav-item i{font-size:17px;width:20px;text-align:center}
#sidebar-bottom{padding:12px 8px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px}
.user-av{width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:12px;font-weight:700;color:var(--txt)}
.user-role{font-size:11px;color:var(--txt3)}
.logout-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--red);font-size:12px;font-weight:600;margin-top:4px;transition:all .15s}
.logout-btn:hover{background:rgba(239,68,68,.1)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-shrink:0}
#topbar h1{font-size:17px;font-weight:700;color:var(--txt)}
.top-date{font-size:12px;color:var(--txt3)}
#content{flex:1;overflow-y:auto;padding:22px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.metric-label{font-size:11px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.metric-val{font-size:24px;font-weight:800;color:var(--txt);line-height:1}
.metric-sub{font-size:11px;color:var(--txt3);margin-top:4px}
.metric-card.blue .metric-val{color:var(--blue)}
.metric-card.green .metric-val{color:var(--green)}
.metric-card.amber .metric-val{color:var(--amber)}
.metric-card.purple .metric-val{color:var(--purple)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-header h2{font-size:15px;font-weight:700;color:var(--txt)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.empty{text-align:center;padding:40px 20px;color:var(--txt3)}
.empty i{font-size:36px;margin-bottom:10px;display:block}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--surface2);color:var(--txt);border:1px solid var(--border)}.btn-secondary:hover{background:var(--surface3)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.btn-green{background:var(--green);color:#0b0b0f}
.btn-purple{background:var(--purple);color:#0b0b0f}
.btn-sm{padding:5px 10px;font-size:12px}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--surface2)}
td{padding:11px 14px;font-size:13px;color:var(--txt);border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.badge-green{background:rgba(34,211,165,.15);color:var(--green)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-blue{background:rgba(79,142,247,.15);color:var(--blue)}
.badge-gray{background:var(--surface2);color:var(--txt2)}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:24px;width:520px;max-width:95vw;max-height:85vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:700;margin-bottom:18px;color:var(--txt)}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
label{font-size:12px;font-weight:700;color:var(--txt2)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--txt);font-family:inherit;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:70px}
input[readonly]{opacity:.6;cursor:default}
.orc-items-list{background:var(--surface2);border-radius:8px;padding:12px;margin:8px 0}
.orc-item-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.orc-item-row:last-child{margin-bottom:0}
.remove-item{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:2px;font-family:inherit;flex-shrink:0}
.total-box{background:rgba(34,211,165,.08);border:1px solid rgba(34,211,165,.25);border-radius:8px;padding:12px 16px;margin-top:12px;text-align:right}
.total-box .tlabel{font-size:12px;color:var(--txt3);margin-bottom:2px}
.total-box .tval{font-size:22px;font-weight:800;color:var(--green)}
.cal-header-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-name{text-align:center;font-size:11px;font-weight:700;color:var(--txt3);padding:4px}
.cal-day{min-height:68px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px}
.cal-day.today{border-color:var(--blue);background:rgba(79,142,247,.06)}
.cal-day.other-month .day-num{color:var(--txt3)}
.day-num{font-size:12px;font-weight:700;margin-bottom:3px}
.cal-event.blue{background:var(--blue)}
.tooltip-agenda{
  position:fixed;z-index:999;background:var(--surface);border:1px solid var(--border2);
  border-radius:10px;padding:10px 12px;min-width:180px;max-width:240px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;
  font-size:12px;color:var(--txt);line-height:1.5;display:none;
}
.tooltip-agenda .tip-title{font-weight:700;font-size:13px;margin-bottom:2px}
.tooltip-agenda .tip-hora{color:var(--txt3);font-size:11px;margin-bottom:6px}
.tooltip-agenda .tip-col{display:flex;align-items:center;gap:6px;margin-top:4px}
.tooltip-agenda .tip-av{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cal-event{font-size:10px;border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event.green{background:rgba(34,211,165,.2);color:var(--green)}
.cal-event.amber{background:rgba(245,158,11,.2);color:var(--amber)}
.usuarios-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.usuario-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.usuario-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;margin-bottom:10px}
.cor-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:200;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}

/* ── GALERIA DE REGISTROS ──────────────────────────── */
.fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
.foto-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .2s}
.foto-card:hover{transform:translateY(-2px)}
.foto-card img{width:100%;height:180px;object-fit:cover;display:block;cursor:pointer}
.foto-card .foto-info{padding:10px 12px}
.foto-card .foto-leg{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:4px}
.foto-card .foto-meta{font-size:11px;color:var(--txt3)}
.foto-card .foto-evento{font-size:11px;color:var(--blue);margin-bottom:4px}
.foto-card .foto-acoes{display:flex;gap:6px;margin-top:8px}

/* Lightbox */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;align-items:center;justify-content:center;flex-direction:column}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:8px}
#lightbox .lb-info{color:#fff;margin-top:12px;text-align:center;font-size:14px}
#lightbox .lb-close{position:absolute;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;background:rgba(255,255,255,.1);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}

/* ── RESPONSIVO MOBILE ─────────────────────────────── */
@media (max-width: 768px){

  /* Sidebar deslizante */
  #sidebar{
    position:fixed;left:-240px;top:0;bottom:0;z-index:50;width:240px;
    transition:left .25s ease;box-shadow:4px 0 20px rgba(0,0,0,.4);
  }
  #sidebar.open{ left:0; }
  #overlay-mobile{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;
  }
  #overlay-mobile.open{ display:block; }

  /* Topbar */
  #topbar{ padding:10px 14px; }
  #btn-menu{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:8px;cursor:pointer;
    background:var(--surface2);border:1px solid var(--border);
    color:var(--txt);font-size:22px;margin-right:10px;flex-shrink:0;
  }
  #page-title{ font-size:16px; }

  /* Conteúdo */
  #main{ width:100vw; }
  #content{ padding:12px 10px; }

  /* Tabelas rolam */
  .table-wrap{ overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px; }
  table{ min-width:480px;font-size:12px; }
  th,td{ padding:8px 10px; }

  /* Botões de ação nas tabelas — só ícones */
  td .btn-sm{ padding:6px 8px;font-size:12px; }

  /* Métricas */
  .metrics{ grid-template-columns:1fr 1fr;gap:8px; }
  .metric-card{ padding:12px; }
  .metric-val{ font-size:20px; }

  /* Modal — tela quase cheia, scroll interno */
  .modal{
    width:100vw;max-width:100vw;
    max-height:92vh;
    border-radius:20px 20px 0 0;
    padding:20px 16px 24px;
    position:fixed;bottom:0;left:0;right:0;top:auto;
    transform:none;
    overflow-y:auto;
  }
  #modal-overlay{
    align-items:flex-end;
  }
  #modal-footer{
    position:sticky;bottom:0;background:var(--surface);
    padding-top:12px;margin-top:12px;
    border-top:1px solid var(--border);
    display:flex;gap:8px;
  }
  #modal-footer .btn{ flex:1;padding:12px;font-size:14px; }

  /* Formulários em coluna */
  .form-row{ grid-template-columns:1fr; }
  .form-group input,.form-group select,.form-group textarea{
    font-size:16px; /* evita zoom no iOS */
    padding:10px 12px;
  }
  .form-group label{ font-size:13px; }

  /* Orçamento — itens */
  .orc-item-row{ flex-wrap:wrap;gap:4px; }

  /* Calendário */
  .cal-day{ min-height:44px;padding:3px; }
  .day-num{ font-size:10px; }
  .cal-event.blue{background:var(--blue)}

.cal-event{ font-size:8px;padding:1px 2px; }
  .cal-day-name{ font-size:10px; }

  /* Section header */
  .section-header{ flex-wrap:wrap;gap:8px; }
  .section-header h2{ font-size:16px; }
  .section-header .btn{ font-size:12px;padding:8px 12px; }

  /* Login */
  .login-box{ padding:24px 18px;margin:16px; }
  .login-btn{ font-size:15px;padding:12px; }

  /* Total box orçamento */
  .total-box{ padding:12px; }
  .tval{ font-size:20px; }

  /* Galeria fotos */
  .fotos-grid{ grid-template-columns:1fr 1fr; }

  /* Badges menores */
  .badge{ font-size:10px;padding:2px 6px; }
}

@media (max-width: 400px){
  .metrics{ grid-template-columns:1fr; }
  .fotos-grid{ grid-template-columns:1fr; }
  .metric-val{ font-size:18px; }
}
#btn-menu{display:none}
</style>
</head>

// Envia dados via iframe (contorna CORS do Apps Script)
function gsPost(aba, dados){
  return new Promise((resolve)=>{
    try{
      const arr=Array.isArray(dados)?dados:[dados];
      const serial=arr.map(item=>{
        const obj={};
        for(const[k,v] of Object.entries(item)){
          obj[k]=(typeof v==='object'&&v!==null)?JSON.stringify(v):v;
        }
        return obj;
      });
      const body=JSON.stringify({aba,acao:'salvar_tudo',dados:serial});
      // Tenta fetch normal primeiro, se falhar usa no-cors (sem resposta)
      fetch(GS_URL,{
        method:'POST',
        body,
        headers:{'Content-Type':'text/plain'} // text/plain evita preflight CORS
      })
      .then(r=>r.json())
      .then(r=>resolve({ok:true,data:r}))
      .catch(()=>{
        // Fallback: no-cors (envia mas não recebe resposta)
        fetch(GS_URL,{method:'POST',body,mode:'no-cors'})
          .then(()=>resolve({ok:true}))
          .catch(e=>resolve({ok:false,erro:e.message}));
      });
    }catch(e){resolve({ok:false,erro:e.message});}
  });
}

// Carrega dados via JSONP (contorna CORS em GET)
function gsGet(aba){
  return new Promise((resolve)=>{
    const cbName='gs_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timeout=setTimeout(()=>{
      delete window[cbName];
      script.remove();
      // Timeout — resolver com null para não travar
      resolve(null);
    },5000);
    window[cbName]=(data)=>{
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
      resolve(data);
    };
    script.src=GS_URL+'?aba='+aba+'&callback='+cbName;
    script.onerror=()=>{
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
      resolve(null);
    };
    document.head.appendChild(script);
  });
}

const DB={
  _tok(){return localStorage.getItem('sc_token')||'';},
  get(k){try{return JSON.parse(localStorage.getItem('sc_'+k)||'null')}catch(e){return null}},
  set(k,v){
    localStorage.setItem('sc_'+k,JSON.stringify(v));
    // Sync com Google Sheets em background
    if(['clientes','equipamentos','orcamentos','pagamentos','colaboradores','escalas','usuarios'].includes(k)){
      const arr=Array.isArray(v)?v:(v?[v]:[]);
      if(arr.length===0){gsPost(k,[]).catch(()=>{});return;}
      const serial=arr.filter(item=>item&&typeof item==='object').map(item=>{
        const obj={};
        for(const[key,val] of Object.entries(item)){
          obj[key]=(typeof val==='object'&&val!==null)?JSON.stringify(val):val;
        }
        return obj;
      });
      gsPost(k,serial).catch(e=>console.warn('Sync Sheets falhou:',e));
    }
  },
  async carregarDoSheets(){
    try{
      const el=$('sync-status');
      if(el){el.textContent='Sincronizando...';el.style.color='var(--amber)';}
      const abas=['clientes','equipamentos','orcamentos','pagamentos','colaboradores','escalas','usuarios'];
      const resultados=await Promise.allSettled(
        abas.map(aba=>gsGet(aba).then(dados=>{
          if(Array.isArray(dados)&&dados.length>0){
            const tratados=dados.map(item=>{
              const obj={};
              for(const[k,v] of Object.entries(item)){
                if(v===''||v===null||v===undefined){obj[k]=v;continue;}
                const s=String(v).trim();
                if(s.startsWith('[')||s.startsWith('{')){try{obj[k]=JSON.parse(s);}catch{obj[k]=v;}}
                else if(!isNaN(s)&&s!==''){obj[k]=Number(s);}
                else{obj[k]=v;}
              }
              return obj;
            });
            // Deduplicar por id antes de salvar
            const vistos=new Set();
            const dedup=tratados.filter(item=>{
              if(!item.id) return true;
              if(vistos.has(item.id)) return false;
              vistos.add(item.id); return true;
            });
            localStorage.setItem('sc_'+aba,JSON.stringify(dedup));
            return true;
          }
          return false;
        }).catch(()=>false)
        )
      );
      const carregou=resultados.some(r=>r.value===true);
      if(el){el.textContent=carregou?'✓ Sincronizado':'✓ Local';el.style.color='var(--green)';}
    }catch(e){
      const el=$('sync-status');
      if(el){el.textContent='✓ Local';el.style.color='var(--txt3)';}
    }
  },
  async fazerBackupSheets(manual=false){
    try{
      const el=$('sync-status');
      if(el){el.textContent='Fazendo backup...';el.style.color='var(--amber)';}
      const dados={
        versao:'1.0',
        data:new Date().toISOString(),
        clientes:this.get('clientes')||[],
        equipamentos:this.get('equipamentos')||[],
        orcamentos:this.get('orcamentos')||[],
        pagamentos:this.get('pagamentos')||[],
        categorias:getCats(),
        colaboradores:this.get('colaboradores')||[],
        escalas:this.get('escalas')||[]
      };
      const dt=new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      // Usar acao:'append' para ADICIONAR linha sem apagar as anteriores
      const body=JSON.stringify({aba:'backup',acao:'append',dados:[{data:dt,dados:JSON.stringify(dados)}]});
      await fetch(GS_URL,{method:'POST',body,headers:{'Content-Type':'text/plain'}})
        .catch(()=>fetch(GS_URL,{method:'POST',body,mode:'no-cors'}));
      localStorage.setItem('sc_ultimo_backup',new Date().toISOString());
      if(el){el.textContent='✓ Sincronizado';el.style.color='var(--green)';}
      const ubtxt=$('ultimo-backup-txt');
      if(ubtxt) ubtxt.textContent='Backup: '+dt;
      if(manual) toast('✅ Backup salvo no Google Sheets!');
      else console.log('Backup automático:',dt);
      return true;
    }catch(e){
      console.warn('Backup falhou:',e);
      if(manual) toast('Erro no backup: '+e.message,false);
      return false;
    }
  },

  async restaurarDoSheets(){
    try{
      toast('Buscando backup...');
      const dados=await gsGet('backup');
      if(!dados||!Array.isArray(dados)||dados.length===0){
        toast('Nenhum backup encontrado',false);return;
      }
      const ultimo=dados[dados.length-1];
      if(!ultimo||!ultimo.dados){toast('Backup inválido',false);return;}
      const backup=JSON.parse(ultimo.dados);
      if(!confirm('Restaurar backup de '+ultimo.data+'?\nIsso substituirá todos os dados atuais.')){return;}
      if(backup.clientes) this.set('clientes',backup.clientes);
      if(backup.equipamentos) this.set('equipamentos',backup.equipamentos);
      if(backup.orcamentos) this.set('orcamentos',backup.orcamentos);
      if(backup.pagamentos) this.set('pagamentos',backup.pagamentos);
      if(backup.categorias) localStorage.setItem('sc_categorias',JSON.stringify(backup.categorias));
      if(backup.colaboradores) this.set('colaboradores',backup.colaboradores);
      if(backup.escalas) this.set('escalas',backup.escalas);
      toast('✅ Backup restaurado!');
      go('dashboard');
    }catch(e){
      toast('Erro ao restaurar: '+e.message,false);
    }
  },
  init(){
    const catsRaw = localStorage.getItem('sc_categorias');
    if(!catsRaw){
      localStorage.setItem('sc_categorias', JSON.stringify(CATS_PADRAO));
    } else {
      try {
        const cats = JSON.parse(catsRaw);
        if(!Array.isArray(cats)||cats.length===0){
          localStorage.setItem('sc_categorias', JSON.stringify(CATS_PADRAO));
        } else {
          // Corrigir: garantir que categorias são array de strings simples
          const corrigidas = cats.map(x=>{
            if(typeof x==='string') return x.trim();
            if(typeof x==='object'&&x!==null){
              return (x.categoria||x.nome||'').toString().trim();
            }
            return String(x||'').trim();
          }).filter(x=>x.length>=1);
          localStorage.setItem('sc_categorias', JSON.stringify(corrigidas));
        }
      } catch(e) {
        localStorage.setItem('sc_categorias', JSON.stringify(CATS_PADRAO));
      }
    }
  }
};

// ── GOOGLE DRIVE INTEGRATION ─────────────────────────
const GDRIVE_CLIENT_ID = '1090261252711-gljlartvba2ee27stnlqjgv4ufnrf7vs.apps.googleusercontent.com';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let gdriveToken = null;
let gdriveTokenExpiry = 0;

function conectarDrive(silencioso=false){
  if(gdriveToken && Date.now() < gdriveTokenExpiry){
    if(!silencioso) toast('Drive já conectado!'); return;
  }
  try{
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID,
      scope: GDRIVE_SCOPE,
      callback:(resp)=>{
        if(resp.error){
          if(!silencioso){
            toast('Erro: '+resp.error, false);
            console.error('Drive auth:', resp);
          }
          sessionStorage.removeItem('gdrive_connected');
          return;
        }
        gdriveToken = resp.access_token;
        gdriveTokenExpiry = Date.now() + (resp.expires_in - 60) * 1000;
        sessionStorage.setItem('gdrive_connected','1');
        if(!silencioso) toast('✅ Google Drive conectado!');
        registros();
      }
    });
    // Se silencioso, usa prompt vazio (tenta sem interação)
    client.requestAccessToken({prompt: silencioso?'':'select_account'});
  }catch(e){
    if(!silencioso){
      console.error('Erro Drive:', e);
      toast('Erro ao iniciar Drive: '+e.message, false);
    }
  }
}

// Tentar reconexão silenciosa ao abrir Registros
function tentarReconectarDrive(){
  if(gdriveToken && Date.now() < gdriveTokenExpiry) return; // já conectado
  if(sessionStorage.getItem('gdrive_connected')){
    setTimeout(()=>conectarDrive(true), 500); // tenta silencioso
  }
}

function getGdriveToken(){
  return new Promise((resolve, reject)=>{
    if(gdriveToken && Date.now() < gdriveTokenExpiry){
      resolve(gdriveToken); return;
    }
    // Token expirou ou não existe — rejeitar para não abrir popup inesperado
    reject('Token Drive não disponível. Clique em Conectar Drive.');
  });
}

async function garantirPastaRegistros(){
  const token = await getGdriveToken();
  // Pasta raiz SomControl
  let r = await fetch(
    "https://www.googleapis.com/drive/v3/files?q=name%3D'SomControl'+and+mimeType%3D'application%2Fvnd.google-apps.folder'+and+trashed%3Dfalse&fields=files(id)",
    {headers:{'Authorization':'Bearer '+token}}
  );
  let data = await r.json();
  let raizId;
  if(data.files && data.files.length > 0){
    raizId = data.files[0].id;
  } else {
    r = await fetch('https://www.googleapis.com/drive/v3/files',{
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body: JSON.stringify({name:'SomControl',mimeType:'application/vnd.google-apps.folder'})
    });
    data = await r.json();
    raizId = data.id;
  }
  // Subpasta Registros
  r = await fetch(
    'https://www.googleapis.com/drive/v3/files?q=name%3D%27Registros%27+and+%27'+raizId+'%27+in+parents+and+mimeType%3D%27application%2Fvnd.google-apps.folder%27+and+trashed%3Dfalse&fields=files(id)',
    {headers:{'Authorization':'Bearer '+token}}
  );
  data = await r.json();
  if(data.files && data.files.length > 0){
    return {token, pastaId: data.files[0].id};
  }
  r = await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    body: JSON.stringify({name:'Registros',mimeType:'application/vnd.google-apps.folder',parents:[raizId]})
  });
  data = await r.json();
  return {token, pastaId: data.id};
}

async function uploadFotoDrive(base64data, nomeArquivo, legenda){
  // Verificar se tem token antes de qualquer coisa
  if(!gdriveToken || Date.now() >= gdriveTokenExpiry){
    console.warn('Drive: sem token válido. Conecte o Drive primeiro.');
    return null;
  }
  try{
    const res = await garantirPastaRegistros();
    const token = res.token;
    const pastaId = res.pastaId;
    const base64 = base64data.split(',')[1];
    const byteChars = atob(base64);
    const byteArr = new Uint8Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++) byteArr[i] = byteChars.charCodeAt(i);
    const blob = new Blob([byteArr], {type:'image/jpeg'});
    const metadata = {name: nomeArquivo, parents:[pastaId], description: legenda};
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
    form.append('file', blob);
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{
      method:'POST',
      headers:{'Authorization':'Bearer '+token},
      body: form
    });
    const data = await r.json();
    return {id: data.id, url: data.webViewLink};
  } catch(e){
    console.error('Erro upload Drive:', e);
    return null;
  }
}

function salvarRegistro(){
  const input=$('f-foto');
  if(!input?.files?.length){toast('Selecione uma foto',false);return;}
  const file=input.files[0];
  const leg=$('f-leg')?.value?.trim()||'';
  const orc_id=$('f-orc-reg')?.value||'';
  const now=new Date();
  const dt=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const nomeArq='Registro_'+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'_'+now.getTime()+'.jpg';
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=async ()=>{
      // Comprimir
      const canvas=document.createElement('canvas');
      const MAX=1200;
      let w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const foto=canvas.toDataURL('image/jpeg',0.75);
      // Thumbnail ainda menor para localStorage
      const cThumb=document.createElement('canvas');
      const TH=300;
      let tw=w,th=h;
      if(tw>TH){th=Math.round(th*TH/tw);tw=TH;}
      cThumb.width=tw;cThumb.height=th;
      cThumb.getContext('2d').drawImage(img,0,0,tw,th);
      const thumb=cThumb.toDataURL('image/jpeg',0.5);
      // Salvar localmente com thumb
      const regs=JSON.parse(localStorage.getItem('sc_registros')||'[]');
      const reg={id:Date.now().toString(),foto:thumb,legenda:leg,orc_id:orc_id?parseInt(orc_id):null,dt,drive_url:null,drive_id:null};
      regs.push(reg);
      localStorage.setItem('sc_registros',JSON.stringify(regs));
      closeModal();
      toast('Enviando para o Google Drive...');
      registros();
      // Upload Drive automático
      try{
        const resultado=await uploadFotoDrive(foto,nomeArq,leg);
        if(resultado){
          const regs2=JSON.parse(localStorage.getItem('sc_registros')||'[]');
          const i=regs2.findIndex(r=>r.id===reg.id);
          if(i>=0){regs2[i].drive_url=resultado.url;regs2[i].drive_id=resultado.id;}
          localStorage.setItem('sc_registros',JSON.stringify(regs2));
          registrarLog('Registro salvo no Drive',leg||nomeArq);
          toast('✅ Foto salva no Google Drive!');
          registros();
        } else { toast('Salvo localmente',true); }
      }catch(err){
        console.warn('Drive falhou:',err);
        registrarLog('Registro salvo localmente',leg||nomeArq);
        if(String(err).includes('Token')){
          toast('⚠️ Conecte o Drive antes de tirar a foto',false);
        } else {
          toast('Salvo localmente (erro no Drive)',true);
        }
      }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function delRegistro(id){
  if(!confirm('Excluir este registro?'))return;
  const regs=JSON.parse(localStorage.getItem('sc_registros')||'[]');
  localStorage.setItem('sc_registros',JSON.stringify(regs.filter(r=>r.id!==id)));
  registrarLog('Excluir registro',id);

let _agendaYM = null;

function showTooltipAgenda(evt, id){
  const tip=$('tooltip-agenda');
  if(!tip)return;
  const orcs=DB.get('orcamentos')||[];
  const evts=DB.get('eventos_agenda')||[];
  const cols=DB.get('colaboradores')||[];
  let titulo='',hora='',local='',colaboradores=[];

  if(typeof id==='string'&&id.startsWith('ev_')){
    const evId=id.replace('ev_','');
    const ev=evts.find(e=>e.id===evId);
    if(!ev)return;
    titulo=ev.titulo;
    hora=(ev.hora_ini||'')+(ev.hora_fim?' → '+ev.hora_fim:'');
    local=ev.local||'';
    colaboradores=(ev.colaboradores||[]).map(cid=>cols.find(c=>c.id===cid)).filter(Boolean);
  } else {
    const orc=orcs.find(o=>o.id===id||o.id===parseInt(id));
    if(!orc)return;
    titulo=orc.cliente+' — '+orc.evento;
    hora=orc.data_evento?(fmtD(orc.data_evento)+(orc.data_ret?' → '+fmtD(orc.data_ret):'')):'';
    local=orc.local||'';
    // Buscar escala vinculada
    const escalas=DB.get('escalas')||[];
    const escala=escalas.find(e=>e.orc_id===orc.id);
    if(escala) colaboradores=(escala.colab_ids||[]).map(cid=>cols.find(c=>c.id===cid)).filter(Boolean);
  }

  tip.innerHTML=`
    <div class="tip-title">${titulo}</div>
    ${hora?`<div class="tip-hora"><i class="ti ti-clock" style="font-size:10px"></i> ${hora}</div>`:''}
    ${local?`<div class="tip-hora"><i class="ti ti-map-pin" style="font-size:10px"></i> ${local}</div>`:''}
    ${colaboradores.length?`
      <div style="font-size:11px;color:var(--txt3);margin-top:6px;margin-bottom:2px;font-weight:700">ESCALADOS</div>
      ${colaboradores.map(co=>`<div class="tip-col">
        <div class="tip-av">${co.nome[0]}</div>
        <span>${co.nome} <span style="color:var(--txt3);font-size:10px">${co.funcao||''}</span></span>
      </div>`).join('')}
    `:`<div style="font-size:11px;color:var(--txt3);margin-top:4px">Nenhum colaborador escalado</div>`}`;

  tip.style.display='block';
  tip.style.left='-9999px'; // posicionar fora para medir
  tip.style.top='-9999px';
  // Calcular posição após render
  requestAnimationFrame(()=>{
    const x=evt.clientX, y=evt.clientY;
    const tw=tip.offsetWidth||220, th=tip.offsetHeight||120;
    const left=x+tw+20>window.innerWidth?x-tw-10:x+14;
    const top=y+th+10>window.innerHeight?y-th-10:y+10;
    tip.style.left=Math.max(8,left)+'px';
    tip.style.top=Math.max(8,top)+'px';
  });
}

function registrarLog(acao, detalhes=''){
  try {

    const entrada = {

      data: new Date().toLocaleDateString('pt-BR'),
      hora: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit',second:'2-digit'}),
      usuario: currentUser ? currentUser.nome : 'Sistema',
      acao,
      detalhes: String(detalhes||'')
    };
    logs.unshift(entrada); // mais recente primeiro
    // Manter só os últimos 500 registros
    if(logs.length > 500) logs.splice(500);

  } catch(e) { console.warn('Erro ao registrar log:', e); }
}

async function doLogin(){
  const u=$('inp-user').value.trim(),p=$('inp-pass').value;
  if(!u||!p){$('login-err').style.display='block';return;}

  // Verificar usuários fixos primeiro (rápido, sem API)
  const fixo=USUARIOS_FIXOS.find(x=>x.usuario.toLowerCase()===u.toLowerCase()&&x.senha===p);
  if(fixo){
    entrarNoSistema(fixo);
    return;
  }

  // Verificar usuários extras do localStorage
  const extras=(DB.get('usuarios')||[]).find(x=>x.usuario.toLowerCase()===u.toLowerCase()&&x.senha===p);
  if(extras){
    entrarNoSistema(extras);
    return;
  }

  // Credenciais inválidas
  $('login-err').style.display='block';
  $('inp-pass').value='';
}

async function abrirGerenciadorBackup(){
  openModal('☁️ Gerenciador de Backups',`
    <div id="backup-content" style="min-height:80px;display:flex;align-items:center;justify-content:center">
      <div style="color:var(--txt3);font-size:13px"><i class="ti ti-loader-2"></i> Buscando backups...</div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Fechar</button>
     <button class="btn btn-primary" onclick="fazerNovoBackup()"><i class="ti ti-cloud-upload"></i> Fazer backup agora</button>`
  );
  // Carregar lista de backups
  try{
    const dados = await gsGet('backup');
    const div = document.getElementById('backup-content');
    if(!div) return;
    if(!dados||!Array.isArray(dados)||dados.length===0){
      div.innerHTML='<div class="empty"><i class="ti ti-cloud-off"></i><p>Nenhum backup encontrado.<br>Crie a aba "backup" na planilha.</p></div>';
      return;
    }
    // Mostrar backups do mais recente para o mais antigo
    const lista=[...dados].reverse();
    div.innerHTML=`
      <div style="margin-bottom:10px;font-size:12px;color:var(--txt3)">${lista.length} backup(s) encontrado(s)</div>
      <div style="display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto">
        ${lista.map((b,i)=>`
          <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:700;color:var(--txt)"><i class="ti ti-calendar"></i> ${b.data||'Data desconhecida'}</div>
              ${b.dados?`<div style="font-size:11px;color:var(--txt3);margin-top:3px">
                ${(()=>{try{const d=JSON.parse(b.dados);return `${d.clientes?.length||0} clientes · ${d.equipamentos?.length||0} equip. · ${d.orcamentos?.length||0} orç.`;}catch{return 'Dados disponíveis';}})()}
              </div>`:''}
            </div>
            <button class="btn btn-primary btn-sm" onclick="restaurarBackup(${dados.length-1-i})">
              <i class="ti ti-restore"></i> Restaurar
            </button>
          </div>`).join('')}
      </div>`;
  }catch(e){
    const div=document.getElementById('backup-content');
    if(div) div.innerHTML='<div class="empty"><i class="ti ti-alert-circle"></i><p>Erro ao buscar backups.<br>'+e.message+'</p></div>';

async function fazerNovoBackup(){
  const btn=document.querySelector('#modal-footer .btn-primary');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Salvando...';}

  } else {

async function restaurarBackup(idx){
  try{
    const dados=await gsGet('backup');
    if(!dados||!dados[idx]){toast('Backup não encontrado',false);return;}
    const b=dados[idx];
    if(!b.dados){toast('Backup inválido',false);return;}
    const backup=JSON.parse(b.dados);
    if(!confirm('Restaurar backup de '+b.data+'?\n\nIsso substituirá TODOS os dados atuais.\nEsta ação não pode ser desfeita.')){return;}
    if(backup.clientes) DB.set('clientes',backup.clientes);
    if(backup.equipamentos) DB.set('equipamentos',backup.equipamentos);
    if(backup.orcamentos) DB.set('orcamentos',backup.orcamentos);
    if(backup.pagamentos) DB.set('pagamentos',backup.pagamentos);
    if(backup.categorias) localStorage.setItem('sc_categorias',JSON.stringify(backup.categorias));
    if(backup.colaboradores) DB.set('colaboradores',backup.colaboradores);
    if(backup.escalas) DB.set('escalas',backup.escalas);
    closeModal();
    toast('✅ Backup de '+b.data+' restaurado!');
    setTimeout(()=>go('dashboard'),500);
  }catch(e){
    toast('Erro ao restaurar: '+e.message,false);
  }
}

function go(page){
  // Fechar menu mobile ao navegar
  $('sidebar')?.classList.remove('open');
  $('overlay-mobile')?.classList.remove('open');
  // Ativar nav-item pelo onclick em vez de índice (evita problema com itens hidden)
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.remove('active');
    if(n.getAttribute('onclick')===`go('${page}')`){
      n.classList.add('active');
    }
  });
  const titles={dashboard:'Dashboard',clientes:'Clientes',equipamentos:'Equipamentos',orcamentos:'Orçamentos',agenda:'Agenda',pagamentos:'Pagamentos',relatorios:'Relatórios',colaboradores:'Colaboradores',escalas:'Escalas',registros:'Registros de Eventos',tarefas:'Tarefas',usuarios:'Usuários',log:'Log de Atividades'};
  $('page-title').textContent=titles[page]||page;
  // Chamar a função da página — tenta pages[page] primeiro, depois função global
  if(typeof pages[page]==='function') pages[page]();

}

// Modal não fecha ao clicar fora — evitar perda de dados
function toast(msg,ok=true){
  const t=$('toast');t.textContent=msg;
  t.style.background=ok?'var(--green)':'var(--red)';t.style.color=ok?'#0b0b0f':'#fff';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}
function calcTempo(data){
  if(!data) return '';
  try{
    const d=new Date(data+'T12:00');
    if(isNaN(d.getTime())) return '';
    const agora=new Date();
    const meses=Math.round((agora-d)/2592000000);
    if(meses<1) return 'Novo cliente';
    if(meses<12) return meses+' mês'+(meses>1?'es':'');
    const anos=Math.floor(meses/12);
    const m=meses%12;
    return anos+' ano'+(anos>1?'s':'')+(m>0?' e '+m+' mês'+(m>1?'es':''):'');
  }catch(e){return '';}
}
const brl=v=>'R$ '+parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});
const fmtD=s=>{if(!s)return'';try{const d=new Date(s+'T12:00');return isNaN(d.getTime())?'':d.toLocaleDateString('pt-BR')}catch(e){return''}};

// GERADOR DE PDF (jsPDF) — layout INCA
// ══════════════════════════════════════════════════════
function gerarPDF(orc, interno=false){
  try{
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,ML=15,MR=15,CW=W-ML-MR;
  let y=12;

  // Helper: garante string segura
  const ss=v=>String(v==null?'':v);
  // Helper: garante número seguro
  const nn=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};

  const linha=(y1)=>{doc.setDrawColor(0);doc.setLineWidth(0.4);doc.line(ML,y1,W-MR,y1);};

  const txt=(text,x,yw,opts={})=>{
    const safeText=ss(text);
    doc.setFontSize(opts.size||9);
    doc.setFont('helvetica',opts.bold?'bold':'normal');
    const col=opts.color||[0,0,0];
    doc.setTextColor(col[0],col[1],col[2]);
    doc.text(safeText,x,yw,{align:opts.align||'left',maxWidth:opts.maxW||undefined});
  };

  // LOGO
  try{doc.addImage(LOGO_B64,'PNG',ML,y,22,22);}catch(e){console.warn('Logo erro:',e);}

  // CABEÇALHO
  const rx=W-MR;
  txt('11 97409-0130',rx,y+5,{bold:true,align:'right',size:10});
  txt('CONTATOINCAAUDIO@GMAIL.COM',rx,y+10,{align:'right',size:8,color:[80,80,80]});
  txt('GUT SOLUÇÕES EM AUDIO LTDA',rx,y+16,{bold:true,align:'right',size:9});
  txt('CNPJ: 14.709.564/0001-02',rx,y+21,{align:'right',size:8,color:[80,80,80]});
  y+=27;
  linha(y);y+=6;

  // DATA
  const hoje=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  txt('São Paulo, '+hoje,ML,y,{size:9});y+=7;

  // TÍTULO + VALIDADE
  txt('PROPOSTA DE ORÇAMENTO',ML,y,{bold:true,size:15});
  const dataRet=orc.data_ret||orc.data_retorno||'';
  const valDate=orc.validade?new Date(orc.validade+'T12:00'):new Date(Date.now()+10*86400000);
  const val=valDate.toLocaleDateString('pt-BR');
  txt('Validade: '+val,rx,y,{bold:true,size:10,align:'right'});
  y+=8;

  // BLOCO CLIENTE / EVENTO
  const bh=7,bp=2;
  const cols=[38,62,22,CW-38-62-22];

  function cabRow(labels,y0,bg){
    let xx=ML;
    labels.forEach((l,i)=>{
      if(bg){doc.setFillColor(bg[0],bg[1],bg[2]);doc.rect(xx,y0,cols[i],bh,'F');}
      doc.setDrawColor(180);doc.setLineWidth(0.3);doc.rect(xx,y0,cols[i],bh,'S');
      txt(ss(l),xx+bp,y0+5,{bold:true,size:8});
      xx+=cols[i];
    });
  }
  function dataRow(vals,y0){
    let xx=ML;
    vals.forEach((v,i)=>{
      doc.setDrawColor(180);doc.setLineWidth(0.3);doc.rect(xx,y0,cols[i],bh,'S');
      if(v) txt(ss(v),xx+bp,y0+5,{size:8,maxW:cols[i]-bp*2});
      xx+=cols[i];
    });
  }

  // Dados do cliente com fallbacks
  const nomeCliente=ss(orc.cliente||orc.nome_cliente||'');
  const periodoEvento=ss(orc.evento_periodo||((orc.data_evento?fmtD(orc.data_evento):'')+
    (orc.data_ret?' a '+fmtD(orc.data_ret):'')));
  const localEvento=ss(orc.local||orc.local_evento||'');
  const cnpjCliente=ss(orc.cliente_cnpj||'');
  const emailCliente=ss(orc.cliente_email||'');
  const telCliente=ss(orc.cliente_tel||'');
  const formaPag=ss(orc.forma_pagamento||'Depósito Bancário 50% antes, 50% após o evento.');

  cabRow(['CLIENTE','','EVENTO',''],y,[242,242,242]);y+=bh;
  dataRow(['Nome:',nomeCliente,'Período:',periodoEvento],y);y+=bh;
  dataRow(['CNPJ / CPF',cnpjCliente,'Local:',localEvento],y);y+=bh;

  // forma de pagamento
  doc.setDrawColor(180);doc.setLineWidth(0.3);
  doc.rect(ML,y,cols[0],bh,'S');txt('Forma de Pagamento',ML+bp,y+5,{bold:true,size:8});
  doc.rect(ML+cols[0],y,cols[1]+cols[2]+cols[3],bh,'S');
  txt(formaPag,ML+cols[0]+bp,y+5,{size:8,maxW:cols[1]+cols[2]+cols[3]-bp*2});
  y+=bh;
  dataRow(['Email:',emailCliente,'',''],y);y+=bh;
  dataRow(['Telefone:',telCliente,'',''],y);y+=bh+5;

  // TABELA MATERIAL
  const mh=6;
  doc.setFillColor(242,242,242);doc.rect(ML,y,CW,mh,'F');
  doc.setDrawColor(180);doc.rect(ML,y,CW,mh,'S');
  txt('MATERIAL',ML+bp,y+4,{bold:true,size:8});y+=mh;

  const itens=Array.isArray(orc.itens)?orc.itens:[];
  let total_parcial=0;

  if(interno){
    const mc=[CW-18-22-30-32,18,22,30,32];
    const mx=[ML,ML+mc[0],ML+mc[0]+mc[1],ML+mc[0]+mc[1]+mc[2],ML+mc[0]+mc[1]+mc[2]+mc[3]];
    doc.setFillColor(242,242,242);
    mc.forEach((w,i)=>{doc.rect(mx[i],y,w,mh,'F');doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
    txt('Produto',mx[0]+bp,y+4,{bold:true,size:8});
    txt('Qtd.',mx[1]+bp,y+4,{bold:true,size:8});
    txt('Diárias',mx[2]+bp,y+4,{bold:true,size:8});
    txt('Unitário',mx[3]+bp,y+4,{bold:true,size:8});
    txt('Subtotal',mx[4]+bp,y+4,{bold:true,size:8});
    y+=mh;
    itens.forEach(it=>{
      const qtd=nn(it.qtd),dias=nn(it.diarias||1),unit=nn(it.unitario||it.diaria||0);
      const sub=qtd*dias*unit;total_parcial+=sub;
      mc.forEach((w,i)=>{doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
      txt(ss(it.nome),mx[0]+bp,y+4,{size:8,maxW:mc[0]-bp*2});
      txt(ss(qtd),mx[1]+mc[1]/2,y+4,{size:8,align:'center'});
      txt(ss(dias),mx[2]+mc[2]/2,y+4,{size:8,align:'center'});
      txt(brl(unit),mx[3]+mc[3]-bp,y+4,{size:8,align:'right'});
      txt(brl(sub),mx[4]+mc[4]-bp,y+4,{size:8,align:'right'});
      y+=mh;
    });
    mc.forEach((w,i)=>{doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
    txt('TOTAL PARCIAL',mx[0]+bp,y+4,{bold:true,size:8});
    txt(brl(total_parcial),mx[4]+mc[4]-bp,y+4,{bold:true,size:8,align:'right'});
    y+=mh;
  } else {
    const mc=[CW-25-30,25,30];
    const mx=[ML,ML+mc[0],ML+mc[0]+mc[1]];
    doc.setFillColor(242,242,242);
    mc.forEach((w,i)=>{doc.rect(mx[i],y,w,mh,'F');doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
    txt('Produto',mx[0]+bp,y+4,{bold:true,size:8});
    txt('Qtd.',mx[1]+bp,y+4,{bold:true,size:8});
    txt('Diárias',mx[2]+bp,y+4,{bold:true,size:8});
    y+=mh;
    itens.forEach(it=>{
      const qtd=nn(it.qtd),dias=nn(it.diarias||1),unit=nn(it.unitario||it.diaria||0);
      total_parcial+=qtd*dias*unit;
      mc.forEach((w,i)=>{doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
      txt(ss(it.nome),mx[0]+bp,y+4,{size:8,maxW:mc[0]-bp*2});
      txt(ss(qtd),mx[1]+mc[1]/2,y+4,{size:8,align:'center'});
      txt(ss(dias),mx[2]+mc[2]/2,y+4,{size:8,align:'center'});
      y+=mh;
    });
    mc.forEach((w,i)=>{doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
    txt('TOTAL PARCIAL',mx[0]+bp,y+4,{bold:true,size:8});
    y+=mh;
  }

  y+=5;

  // RESUMO FINAL
  const rcol1=CW-40,rcol2=40;
  const frete=nn(orc.frete);
  const servico=nn(orc.servico);
  const desconto=nn(orc.desconto);
  const total=nn(orc.total)||total_parcial+frete;
  // Material = total_parcial (soma dos itens com diárias cobradas)
  const material=total_parcial;

  const rrows=[
    ['MATERIAL',brl(material)],
    ['FRETE TOTAL',frete?brl(frete):''],
    ['SERVIÇO',servico?brl(servico):''],
    ['DESCONTO',desconto?brl(desconto):''],
  ].filter(r=>r[1]);
  rrows.forEach(([l,v])=>{
    doc.setDrawColor(180);
    doc.rect(ML,y,rcol1,mh,'S');doc.rect(ML+rcol1,y,rcol2,mh,'S');
    txt(l,ML+bp,y+4,{bold:true,size:8});
    txt(v,ML+rcol1+rcol2-bp,y+4,{bold:true,size:8,align:'right'});
    y+=mh;
  });
  // TOTAL verde
  doc.setFillColor(76,175,80);doc.rect(ML,y,CW,mh,'F');
  doc.setDrawColor(180);doc.rect(ML,y,rcol1,mh,'S');doc.rect(ML+rcol1,y,rcol2,mh,'S');
  txt('TOTAL',ML+bp,y+4,{bold:true,size:8,color:[255,255,255]});
  txt(brl(total),ML+CW-bp,y+4,{bold:true,size:8,color:[255,255,255],align:'right'});
  y+=mh+10;

  // TERMOS
  const termos='TERMOS CONTRATUAIS: A locatária se responsabiliza pelas eventuais perdas e danos causados ao equipamento, devido ao mau uso de seus operadores e/ou exposição a condições adversas de umidade e temperatura. Incluindo caso fortuito ou força maior.';
  doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(80,80,80);
  const lines=doc.splitTextToSize(termos,CW);
  doc.text(lines,W/2,y,{align:'center'});
  y+=lines.length*4+10;

  // ASSINATURA
  const ax=W/2;
  doc.setDrawColor(0);doc.setLineWidth(0.3);doc.line(ax-30,y,ax+30,y);
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(80,80,80);
  doc.text('Assinatura',ax,y+5,{align:'center'});

  const nomeArq=interno?`INTERNO_Orcamento_${ss(orc.num)}.pdf`:`Orcamento_${ss(orc.num)}_INCA.pdf`;
  doc.save(nomeArq);
  }catch(err){
    console.error('Erro gerarPDF:',err);
    toast('Erro ao gerar PDF: '+err.message,false);
  }
}

  const or=DB.get('orcamentos')||[];
  const evts=DB.get('eventos_agenda')||[];
  const now=new Date();
  const y=ym?ym[0]:now.getFullYear();
  const m=ym?ym[1]:now.getMonth();
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dias=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  // Primeiro dia do mês (0=Dom...6=Sáb) → converter para segunda=0
  const rawFirst=new Date(y,m,1).getDay(); // 0=Dom
  const first=(rawFirst===0?6:rawFirst-1); // Dom→6, Seg→0, Ter→1...
  const dim=new Date(y,m+1,0).getDate(),dip=new Date(y,m,0).getDate();
  let cells=[];
  for(let i=first-1;i>=0;i--) cells.push({d:dip-i,cur:false});
  for(let d=1;d<=dim;d++) cells.push({d,cur:true});
  while(cells.length%7!==0) cells.push({d:cells.length-dim-first+1,cur:false});

  // Pré-calcular quais dias do mês têm orçamentos (período completo)
  const diasComOrc={};
  or.forEach(o=>{
    if(!o.data_evento) return;
    const inicio = new Date(o.data_evento+'T12:00');
    const fim    = new Date((o.data_ret||o.data_evento)+'T12:00');
    for(let dt=new Date(inicio); dt<=fim; dt.setDate(dt.getDate()+1)){
      if(dt.getFullYear()===y && dt.getMonth()===m){
        const dia = dt.getDate();
        if(!diasComOrc[dia]) diasComOrc[dia]=[];
        if(!diasComOrc[dia].find(x=>x.id===o.id)) diasComOrc[dia].push(o);
      }
    }
  });
  // Adicionar eventos manuais da agenda — iterar todo o período
  evts.forEach(ev=>{
    if(!ev.data) return;
    const inicio=new Date(ev.data+'T12:00');
    const fim=new Date((ev.data_fim||ev.data)+'T12:00');
    const horaLabel=ev.hora_ini?ev.hora_ini:'';
    for(let dt=new Date(inicio);dt<=fim;dt.setDate(dt.getDate()+1)){
      if(dt.getFullYear()===y && dt.getMonth()===m){
        const dia=dt.getDate();
        if(!diasComOrc[dia]) diasComOrc[dia]=[];
        if(!diasComOrc[dia].find(x=>x.id==='ev_'+ev.id)){
          diasComOrc[dia].push({id:'ev_'+ev.id,cliente:ev.titulo,evento:ev.descricao||'',hora:horaLabel,status:'evento',_isEvento:true,_ev:ev});
        }
      }
    }
  });
  $('content').innerHTML=`
  <div class="section-header">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="btn btn-secondary btn-sm" onclick="navAgenda(-1)"><i class="ti ti-chevron-left"></i></button>
      <h2 style="min-width:160px;text-align:center">${meses[m]} ${y}</h2>
      <button class="btn btn-secondary btn-sm" onclick="navAgenda(1)"><i class="ti ti-chevron-right"></i></button>
      <button class="btn btn-secondary btn-sm" onclick="navAgenda(0)">Hoje</button>
    </div>
    <button class="btn btn-primary" onclick="novoEventoAgenda()"><i class="ti ti-plus"></i> Novo evento</button>
  </div>
  <div class="cal-header-g">${dias.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
  <div class="cal-grid">${cells.map(c=>{
    const today=c.cur&&c.d===now.getDate();
    const evs=c.cur?(diasComOrc[c.d]||[]):[];
    const dataStr=c.cur?`${y}-${String(m+1).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`:'';
    return `<div class="cal-day${!c.cur?' other-month':''}${today?' today':''}" ${c.cur?`onclick="diaAgendaClick('${dataStr}')" style="cursor:pointer"`:''}">
      <div class="day-num">${c.d}</div>
      ${evs.map(e=>`<div class="cal-event ${e._isEvento?'blue':e.status==='aprovado'?'green':'amber'}"
        onclick="event.stopPropagation();${e._isEvento?`verEvManual('${e._ev.id}')`:`verEventoAgenda(${e.id})`}"
        onmouseenter="showTooltipAgenda(event,${e._isEvento?`'ev_${e._ev?.id}'`:`${e.id}`})"
        onmouseleave="hideTooltipAgenda()"
      >${e._isEvento&&e.hora?e.hora+' ':''  }${e.cliente}</div>`).join('')}
    </div>`;
  }).join('')}</div>
  <div style="display:flex;gap:12px;font-size:12px;color:var(--txt3);margin-top:14px">
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(34,211,165,.3);margin-right:4px"></span>Aprovado</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(245,158,11,.3);margin-right:4px"></span>Pendente</span>
  </div>`;
},

function baixarPDF(id,interno){
  const or=DB.get('orcamentos')||[];
  const o=or.find(x=>x.id===id);
  if(!o){toast('Orçamento não encontrado',false);return;}
  // enriquecer com dados do cliente
  const cl=(DB.get('clientes')||[]).find(c=>c.id===o.cliente_id)||{};
  const dados={
    ...o,
    cliente_cnpj: cl.cnpj_cpf||'',
    cliente_email: cl.email||'',
    cliente_tel:   cl.tel||'',
    forma_pagamento: cl.forma_pagamento||'Depósito Bancário 50% antes, 50% após o evento.',
    evento_periodo: (o.data_evento?fmtD(o.data_evento):'')+(o.data_ret?' a '+fmtD(o.data_ret):''),
    validade: '',
  };
  try{
    gerarPDF(dados, interno);
    toast(interno?'PDF interno baixado!':'PDF cliente baixado!');registrarLog(interno?'PDF interno':'PDF cliente','Orç #'+o.num+' — '+o.cliente);
  }catch(e){
    toast('Erro ao gerar PDF: '+e.message,false);
    console.error(e);
  }
}

function getCats(){
  const PADRAO=['Caixa Ativa','Subwoofer','Mesa de Som','Microfone','Amplificador','Cabo','Outro'];
  try {
    const raw = localStorage.getItem('sc_categorias');
    if(!raw) return PADRAO;
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) return PADRAO;
    const result = parsed.map(x=>{
      // String normal
      if(typeof x==='string') return x.trim();
      // Objeto com chave 'categoria' (formato correto do Sheets)
      if(typeof x==='object'&&x!==null){
        if(x.categoria) return String(x.categoria).trim();
        // Objeto com chaves numéricas {0:'C',1:'a'...} — reconstituir string
        const keys=Object.keys(x).filter(k=>!isNaN(k)).sort((a,b)=>Number(a)-Number(b));
        if(keys.length>0){
          return keys.map(k=>x[k]===0?'':String(x[k]||'')).join('').trim();
        }
        // Objeto com campo 'nome' (formato incorreto)
        if(x.nome&&typeof x.nome==='string') return x.nome.trim();
        // Outros objetos — pegar só o primeiro valor string curto (nome da categoria)
        const vals=Object.values(x).filter(v=>v&&typeof v==='string'&&v.length<50&&!v.startsWith('#'));
        return vals.length>0?vals[0].trim():'';
      }
      return String(x||'').trim();
    }).filter(x=>x.length>=1);
    // Auto-corrigir se resultado parece corrompido
    if(result.length===0) return PADRAO;
    return result.sort((a,b)=>a.localeCompare(b,'pt-BR'));
  } catch(e) {
    return PADRAO;
  }
}
function saveCats(arr){
  // Salva como array de strings no localStorage
  const limpo = arr.map(x=>String(x).trim()).filter(x=>x.length>0);
  localStorage.setItem('sc_categorias', JSON.stringify(limpo));
  // Sincroniza com Sheets convertendo para array de objetos
  const comoObjetos = limpo.map(cat => ({categoria: cat}));
  gsPost('categorias', comoObjetos).catch(e=>console.warn('Sync cats:',e));
}
function renderCatsList(){
  // Unir getCats() com categorias dos equipamentos já cadastrados
  const catsBase=getCats();
  const eq=DB.get('equipamentos')||[];
  const catsEq=[...new Set(eq.map(e=>e.cat).filter(x=>x&&x.length>=1))];
  const cats=[...new Set([...catsBase,...catsEq])].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  // Sincronizar — salvar categorias unificadas
  if(catsEq.some(c=>!catsBase.includes(c))) saveCats(cats);
  const el=$('cats-list');
  if(!el)return;
  el.innerHTML=cats.length?cats.map((cat,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)" id="cat-row-${i}">

}

function editCat(catEnc){
  const cat=decodeURIComponent(catEnc);

  const spans=document.querySelectorAll('#cats-list span');
  let row=null;
  spans.forEach(sp=>{if(sp.textContent===cat) row=sp.closest('div[id^="cat-row-"]');});
  if(!row)return;
  const rowId=row.id.replace('cat-row-','');
  row.innerHTML=`

}

function salvarEditCat(catEnc){
  const nomeAntigo=decodeURIComponent(catEnc);
  const input=document.getElementById('cat-edit-inp');
  if(!input)return;
  const novoNome=input.value.trim();
  if(!novoNome){toast('Nome não pode ser vazio',false);return;}
  const cats=getCats();
  if(cats.some(c=>c===novoNome&&c!==nomeAntigo)){toast('Categoria já existe',false);return;}
  // Atualizar na lista de categorias
  const idx=cats.indexOf(nomeAntigo);
  if(idx>=0) cats[idx]=novoNome; else cats.push(novoNome);
  saveCats(cats);
  // Atualizar equipamentos que usavam a categoria antiga
  const eq=DB.get('equipamentos')||[];
  DB.set('equipamentos',eq.map(e=>e.cat===nomeAntigo?{...e,cat:novoNome}:e));
  toast('Categoria atualizada!');
  renderCatsList();
}

// Calcula estoque disponível para um equipamento em um período
function estoqueDisponivel(nomeEq, dataInicio, dataFim, orcIdIgnorar=null){
  const eq=DB.get('equipamentos')||[];
  const orcs=DB.get('orcamentos')||[];
  const estoqueTotal=eq.filter(x=>x.nome===nomeEq).reduce((s,x)=>s+parseInt(x.qtd||0),0);
  if(!dataInicio||!dataFim) return {total:estoqueTotal, usado:0, disponivel:estoqueTotal, conflitos:[]};
  const d1=new Date(dataInicio+'T12:00');
  const d2=new Date(dataFim+'T12:00');
  // Verificar orçamentos aprovados/pendentes que se sobrepõem ao período
  let totalUsado=0;
  const conflitos=[];
  orcs.forEach(o=>{
    if(orcIdIgnorar && o.id===orcIdIgnorar) return;
    if(o.status==='cancelado') return;
    if(!o.data_evento||!o.data_ret) return;
    const oInicio=new Date(o.data_evento+'T12:00');
    const oFim=new Date(o.data_ret+'T12:00');
    // Verificar sobreposição de datas
    if(oInicio<=d2 && oFim>=d1){
      // Há sobreposição — verificar se usa o mesmo equipamento
      (o.itens||[]).forEach(it=>{
        if(it.nome===nomeEq){
          totalUsado+=parseInt(it.qtd||0);
          conflitos.push({orc_num:o.num,cliente:o.cliente,qtd:it.qtd,
            periodo:fmtD(o.data_evento)+' a '+fmtD(o.data_ret),status:o.status});
        }
      });
    }
  });
  return {total:estoqueTotal, usado:totalUsado, disponivel:Math.max(0,estoqueTotal-totalUsado), conflitos};
}

function addItemOrc(){

  const qtd=parseInt($('f-eq-qtd')?.value)||1;
  const d1=$('f-data')?.value;
  const d2=$('f-ret')?.value;
  const dispInfo=estoqueDisponivel(eqSelecionado.nome,d1,d2);
  const ex=orcItens.findIndex(i=>i.eq_id===sid);
  if(ex>=0) orcItens[ex].qtd+=qtd;
  else orcItens.push({eq_id:sid,nome:eqSelecionado.nome,qtd,diarias:1,unitario:eqSelecionado.diaria,
    estoque:dispInfo.disponivel,estoqueTotal:dispInfo.total,conflitos:dispInfo.conflitos});
  const itemIdx=orcItens.findIndex(i=>i.eq_id===sid);
  if(itemIdx>=0){
    orcItens[itemIdx].estoque=dispInfo.disponivel;
    orcItens[itemIdx].estoqueTotal=dispInfo.total;
    orcItens[itemIdx].conflitos=dispInfo.conflitos;
  }
  renderOrcItens();
}

// Calcula diárias cobradas com tabela de desconto por período
// 1-8 dias:    cobra dias reais
// 9-30 dias:   cobra 8 diárias
// 31-60 dias:  cobra 7 diárias
// 61-90 dias:  cobra 6 diárias
// 91-120 dias: cobra 5 diárias
// 121-365 dias: cobra 4 diárias
function calcDiariasEfetivas(dias, diaria){
  let cobranca;
  if(dias <= 8)        cobranca = dias;
  else if(dias <= 30)  cobranca = 8;
  else if(dias <= 60)  cobranca = 7;
  else if(dias <= 90)  cobranca = 6;
  else if(dias <= 120) cobranca = 5;
  else                 cobranca = 4;
  return {
    diariasEfetivas: dias,
    diariasCobranca: cobranca,
    limiteAtual: cobranca,
    desconto: dias > 8,
    economia: Math.max(0, dias - cobranca) * diaria
  };
}

function renderOrcItens(){
  const prev=$('orc-items-preview'),totEl=$('orc-total');if(!prev)return;
  const d1=$('f-data')?.value,d2=$('f-ret')?.value;
  const dias=(d1&&d2)?Math.max(1,Math.round((new Date(d2)-new Date(d1))/86400000)):1;
  // Calcular diárias com desconto progressivo para cada item
  orcItens.forEach(i=>{
    const calc=calcDiariasEfetivas(dias, i.unitario);
    i.diarias=calc.diariasCobranca;
    i.diariasReais=calc.diariasEfetivas;
    i.calcInfo=calc;
  });
  const frete=parseFloat($('f-frete')?.value||0);
  const descontoVal=parseFloat($('f-desconto-val')?.value||0);
  const descontoTipo=$('f-desconto-tipo')?.value||'R$';
  const sub=orcItens.reduce((s,i)=>s+i.qtd*i.diarias*i.unitario,0);
  const descontoReais=descontoTipo==='%'?Math.round(sub*descontoVal)/100:descontoVal;
  if(!orcItens.length){prev.innerHTML=`<div class="empty" style="padding:16px 0"><i class="ti ti-package"></i><p>Nenhum item ainda</p></div>`;if(totEl)totEl.style.display='none';return;}
  // Atualizar estoque disponível considerando datas
  const d1Atual=$('f-data')?.value;
  const d2Atual=$('f-ret')?.value;
  const alertasEstoque=[];
  orcItens.forEach(it=>{
    if(it.avulso){ it.estoque=null; it.estoqueTotal=null; it.conflitos=[]; return; }
    const dispInfo=estoqueDisponivel(it.nome,d1Atual,d2Atual);
    it.estoque=dispInfo.disponivel;
    it.estoqueTotal=dispInfo.total;
    it.conflitos=dispInfo.conflitos;
    if(it.qtd>dispInfo.disponivel){
      alertasEstoque.push({
        nome:it.nome,pedido:it.qtd,
        disponivel:dispInfo.disponivel,
        total:dispInfo.total,
        falta:it.qtd-dispInfo.disponivel,
        conflitos:dispInfo.conflitos
      });
    }
  });

  // Mostrar alertas
  const alertaDiv=$('orc-alerta-estoque');
  if(alertaDiv){
    if(alertasEstoque.length){
      alertaDiv.style.display='block';
      alertaDiv.innerHTML=`<div style="background:rgba(245,158,11,.1);border:1.5px solid var(--amber);border-radius:10px;padding:14px 16px;margin-bottom:10px">
        <div style="font-weight:700;color:var(--amber);margin-bottom:10px;font-size:14px">
          <i class="ti ti-alert-triangle"></i> Atenção — Conflito de estoque no período!
        </div>
        ${alertasEstoque.map(a=>`
          <div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(245,158,11,.2)">
            <div style="font-size:13px;font-weight:700;color:var(--txt);margin-bottom:4px">
              📦 ${a.nome}
            </div>
            <div style="font-size:12px;color:var(--txt3);margin-bottom:6px">
              Estoque total: <strong style="color:var(--txt)">${a.total}</strong> unid. &nbsp;|&nbsp;
              Disponível neste período: <strong style="color:var(--red)">${a.disponivel}</strong> unid. &nbsp;|&nbsp;
              Pedido: <strong style="color:var(--txt)">${a.pedido}</strong> unid. &nbsp;|&nbsp;
              Faltam: <strong style="color:var(--amber)">${a.falta}</strong> unid.
            </div>
            ${a.conflitos.length?`<div style="font-size:11px;color:var(--txt3);margin-bottom:4px">
              <strong>Comprometido nos eventos:</strong>
            </div>
            ${a.conflitos.map(cf=>`<div style="font-size:11px;background:rgba(239,68,68,.08);border-radius:6px;padding:5px 8px;margin-bottom:3px">
              • Orç. <strong>#${cf.orc_num}</strong> — ${cf.cliente} (${cf.periodo}) — <strong>${cf.qtd}</strong> unid.
              <span class="badge ${cf.status==='aprovado'?'badge-green':'badge-amber'}" style="margin-left:4px">${cf.status}</span>
            </div>`).join('')}`:''}
            <div style="font-size:11px;color:var(--txt3);margin-top:6px">
              → Considere <strong>sublocar</strong> ${a.falta} unid. ou ajustar a quantidade
            </div>
          </div>`).join('')}
      </div>`;
    } else {
      alertaDiv.style.display='none';
      alertaDiv.innerHTML='';
    }
  }

  prev.innerHTML=`<div class="orc-items-list">${orcItens.map((it,idx)=>{
    const semEstoque=!it.avulso&&it.estoque!==undefined&&it.qtd>it.estoque;
    return `
    <div class="orc-item-row" style="${semEstoque?'background:rgba(239,68,68,.05);border-radius:6px;padding:4px 6px;':''}">
      <span style="flex:1;font-size:13px">
        ${it.nome}${it.avulso?' <span class="badge badge-amber" style="font-size:9px">avulso</span>':''}${semEstoque?` <span style="color:var(--red);font-size:11px">(falta ${it.qtd-it.estoque})</span>`:''}
        ${it.calcInfo&&it.calcInfo.desconto?`<br><span style="font-size:10px;color:var(--green)">📅 ${it.diariasReais} dias → cobrado ${it.diarias} diárias (máx ${it.calcInfo.limiteAtual}/mês) · economia ${brl(it.calcInfo.economia*it.qtd)}</span>`:''}
      </span>
      <span style="color:var(--txt3);font-size:12px">${it.qtd}x ${dias} dia(s)</span>
      <span style="color:var(--blue);font-size:12px;min-width:70px;text-align:right">${brl(it.qtd*it.diarias*it.unitario)}</span>
      <button class="remove-item" onclick="removeItemOrc(${idx})"><i class="ti ti-x"></i></button>
    </div>`;}).join('')}</div>`;
  if(totEl){
    totEl.style.display='block';
    const subEl=$('orc-sub-val');
    const descBox=$('orc-desconto-box');
    const descEl=$('orc-desconto-val');
    if(subEl) subEl.textContent=brl(sub+frete);
    if(descontoReais>0){
      if(descBox) descBox.style.display='block';
      if(descEl) descEl.textContent='- '+brl(descontoReais);
    } else {
      if(descBox) descBox.style.display='none';
    }
    $('orc-total-val').textContent=brl(Math.max(0,sub+frete-descontoReais));
  }
}
function salvarOrc(){
  const cl=DB.get('clientes')||[];
  const cid=$('f-cli')?.value?parseInt($('f-cli').value):null;
  const cli=cl.find(c=>c.id===cid)||null;
  const ev=$('f-evento')?.value?.trim(),d1=$('f-data')?.value,d2=$('f-ret')?.value;
  if(!ev||!d1||!d2){toast('Preencha evento e datas',false);return;}
  if(!orcItens.length){toast('Adicione pelo menos um item',false);return;}
  const dias=Math.max(1,Math.round((new Date(d2)-new Date(d1))/86400000));
  orcItens.forEach(i=>{const calc=calcDiariasEfetivas(dias,i.unitario);i.diarias=calc.diariasCobranca;});
  const frete=parseFloat($('f-frete')?.value||0);
  const descontoVal=parseFloat($('f-desconto-val')?.value||0);
  const descontoTipo=$('f-desconto-tipo')?.value||'R$';
  const sub=orcItens.reduce((s,i)=>s+i.qtd*i.diarias*i.unitario,0);
  const descontoReais=descontoTipo==='%'?Math.round(sub*descontoVal*100)/10000*100:descontoVal;
  const total=Math.max(0,sub+frete-descontoReais);
  const or=DB.get('orcamentos')||[];
  const num=String(or.length+1).padStart(4,'0');
  const nomeCliente=cli?cli.nome:($('f-nome-avulso')?.value?.trim()||'Avulso');
  const novo={id:Date.now(),num,cliente_id:cid,cliente:nomeCliente,evento:ev,data_evento:d1,data_ret:d2,
    local:$('f-local')?.value||'',itens:orcItens.map(i=>({nome:i.nome,qtd:i.qtd,diarias:i.diarias,unitario:i.unitario,avulso:i.avulso||false})),
    frete,desconto:descontoReais,desconto_tipo:descontoTipo,desconto_val:descontoVal,total,status:'pendente',
    criado:new Date().toISOString().split('T')[0],
    criado_por:currentUser?.nome||'',
    validade:(()=>{const v=new Date();v.setDate(v.getDate()+10);return v.toISOString().split('T')[0];})()};
  or.push(novo);DB.set('orcamentos',or);
  const pa=DB.get('pagamentos')||[];
  pa.push({id:Date.now(),orc_num:num,cliente:nomeCliente,valor:total,pago:0,metodo:'',status:'pendente',data:novo.criado});
  DB.set('pagamentos',pa);
  closeModal();toast('Orçamento #'+num+' criado!');registrarLog('Novo orçamento', '#'+num+' — '+cli.nome+' — '+brl(total));pages.orcamentos();
}

    </div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Data do evento</label><input id="f-data" type="date" value="${(o.data_evento||'').substring(0,10)}" onchange="renderOrcItens()"></div>
    <div class="form-group"><label>Devolução</label><input id="f-ret" type="date" value="${(o.data_ret||'').substring(0,10)}" onchange="renderOrcItens()"></div>
  </div>

  <div class="form-row single"><div class="form-group"><label>Filtrar por categoria</label>
    <select id="f-cat-filtro" onchange="filtrarEqOrc()">

    </select></div>
    <div class="form-group"><label>Qtd</label>
      <div style="display:flex;gap:6px;align-items:center">
        <input id="f-eq-qtd" type="number" value="1" min="1" style="width:70px">

  <div id="orc-items-preview"><div class="empty" style="padding:16px 0"><i class="ti ti-package"></i><p>Nenhum item ainda</p></div></div>
  <div class="form-row">
    <div class="form-group"><label>Frete (R$)</label><input id="f-frete" type="number" value="${frete||0}" min="0" onchange="renderOrcItens()"></div>

      <div style="display:flex;gap:6px;align-items:center">

function salvarEdicaoOrc(id){
  const orcs=DB.get('orcamentos')||[];
  const idx=orcs.findIndex(x=>x.id===id);if(idx<0)return;
  const o=orcs[idx];
  const cl=DB.get('clientes')||[];
  const cid=$('f-cli')?.value?parseInt($('f-cli').value):null;
  const cli=cl.find(c=>c.id===cid)||null;
  const ev=$('f-evento')?.value?.trim(),d1=$('f-data')?.value,d2=$('f-ret')?.value;
  if(!ev||!d1||!d2){toast('Preencha evento e datas',false);return;}
  if(!orcItens.length){toast('Adicione pelo menos um item',false);return;}
  const dias=Math.max(1,Math.round((new Date(d2)-new Date(d1))/86400000));
  orcItens.forEach(i=>{const calc=calcDiariasEfetivas(dias,i.unitario);i.diarias=calc.diariasCobranca;});
  const frete=parseFloat($('f-frete')?.value||0);
  const descontoVal=parseFloat($('f-desconto-val')?.value||0);
  const descontoTipoSel=$('f-desconto-tipo')?.value||'R$';
  const sub=orcItens.reduce((s,i)=>s+i.qtd*i.diarias*i.unitario,0);
  const descontoReais=descontoTipoSel==='%'?(sub*descontoVal/100):descontoVal;
  const total=Math.max(0,sub+frete-descontoReais);
  const nomeCliente=cli?cli.nome:($('f-nome-avulso')?.value?.trim()||o.cliente||'Avulso');
  orcs[idx]={...o,
    cliente_id:cid, cliente:nomeCliente, evento:ev,
    data_evento:d1, data_ret:d2,
    local:$('f-local')?.value||'',
    itens:orcItens.map(i=>({nome:i.nome,qtd:i.qtd,diarias:i.diarias,unitario:i.unitario,avulso:i.avulso||false})),
    frete, desconto:descontoReais, desconto_tipo:descontoTipoSel, desconto_val:descontoVal, total
  };
  DB.set('orcamentos',orcs);
  // Atualizar pagamento vinculado
  const pags=DB.get('pagamentos')||[];
  const pi=pags.findIndex(p=>p.orc_num===o.num);
  if(pi>=0){pags[pi].valor=total;pags[pi].cliente=nomeCliente;DB.set('pagamentos',pags);}
  registrarLog('Editar orçamento','#'+o.num+' — '+nomeCliente);
  toast('Orçamento atualizado!');
  closeModal();
  pages.orcamentos();
}

function recalcVerOrc(id){
  const orcs=DB.get('orcamentos')||[];
  const o=orcs.find(x=>x.id===id);if(!o)return;
  const sub=(o.itens||[]).reduce((s,i)=>s+i.qtd*i.diarias*i.unitario,0);
  const frete=parseFloat($('v-frete')?.value||0);
  const dVal=parseFloat($('v-desconto-val')?.value||0);
  const dTipo=$('v-desconto-tipo')?.value||'R$';
  const desconto=dTipo==='%'?(sub*dVal/100):dVal;
  const total=Math.max(0,sub+frete-desconto);
  const vt=$('v-total-val');
  const vd=$('v-desc-val');
  const db=$('v-desc-box');
  if(vt) vt.textContent=brl(total);
  if(desconto>0){
    if(db) db.style.display='block';
    if(vd) vd.textContent='- '+brl(desconto);
  } else {
    if(db) db.style.display='none';
  }
}

function salvarDescontoOrc(id){
  const orcs=DB.get('orcamentos')||[];
  const idx=orcs.findIndex(x=>x.id===id);if(idx<0)return;
  const o=orcs[idx];
  const sub=(o.itens||[]).reduce((s,i)=>s+i.qtd*i.diarias*i.unitario,0);
  const frete=parseFloat($('v-frete')?.value||0);
  const dVal=parseFloat($('v-desconto-val')?.value||0);
  const dTipo=$('v-desconto-tipo')?.value||'R$';
  const desconto=dTipo==='%'?(sub*dVal/100):dVal;
  const total=Math.max(0,sub+frete-desconto);
  orcs[idx]={...o,frete,desconto,desconto_val:dVal,desconto_tipo:dTipo,total};
  DB.set('orcamentos',orcs);
  // Atualizar pagamento vinculado
  const pags=DB.get('pagamentos')||[];
  const pi=pags.findIndex(p=>p.orc_num===o.num);
  if(pi>=0){pags[pi].valor=total;DB.set('pagamentos',pags);}
  toast('Desconto salvo!');
  closeModal();
  pages.orcamentos();
}
function updateStatusOrc(id,st){
  const or=DB.get('orcamentos')||[];const i=or.findIndex(x=>x.id===id);
  if(i>=0){or[i].status=st;DB.set('orcamentos',or);registrarLog('Status orçamento','#'+(or[i].num||id)+' → '+st);toast('Status atualizado!');}
}
function delOrc(id){
  if(!confirm('Excluir orçamento e pagamento vinculado?'))return;
  const orc_del=(DB.get('orcamentos')||[]).find(x=>x.id===id);
  // Remover orçamento
  DB.set('orcamentos',(DB.get('orcamentos')||[]).filter(x=>x.id!==id));
  // Remover pagamento vinculado automaticamente
  if(orc_del?.num){
    DB.set('pagamentos',(DB.get('pagamentos')||[]).filter(x=>x.orc_num!==orc_del.num));
  }
  registrarLog('Excluir orçamento','#'+(orc_del?.num||id)+' — '+(orc_del?.cliente||''));
  toast('Orçamento e pagamento removidos!');pages.orcamentos();
}

// ── PAGAMENTOS ────────────────────────────────────────
function delPagamento(id){
  if(!confirm('Excluir este pagamento?'))return;
  const p=(DB.get('pagamentos')||[]).find(x=>x.id===id);
  DB.set('pagamentos',(DB.get('pagamentos')||[]).filter(x=>x.id!==id));
  registrarLog('Excluir pagamento','Orç #'+(p?.orc_num||id)+' — '+(p?.cliente||''));
  toast('Pagamento removido!');
  pages.pagamentos();
}
function registrarPag(id){
  const p=(DB.get('pagamentos')||[]).find(x=>x.id===id);if(!p)return;
  openModal(`Pagamento — #${p.orc_num}`,`
  <div style="background:var(--surface2);border-radius:8px;padding:14px;margin-bottom:14px;font-size:13px">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--txt3)">Total</span><strong>${brl(p.valor)}</strong></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--txt3)">Já pago</span><strong style="color:var(--green)">${brl(p.pago)}</strong></div>
    <div style="display:flex;justify-content:space-between"><span style="color:var(--txt3)">Restante</span><strong style="color:var(--amber)">${brl(p.valor-p.pago)}</strong></div>
  </div>
  <div class="form-row"><div class="form-group"><label>Valor recebido agora (R$)</label>
    <input id="f-vp" type="number" value="${(p.valor-p.pago).toFixed(2)}" min="0">
  </div><div class="form-group"><label>Forma de pagamento</label>
    <select id="f-met"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option></select>
  </div></div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
   <button class="btn btn-green" onclick="salvarPag(${id})"><i class="ti ti-check"></i>Registrar</button>`);
}
function salvarPag(id){
  const val=parseFloat($('f-vp')?.value||0),met=$('f-met')?.value;
  const pa=DB.get('pagamentos')||[];const i=pa.findIndex(x=>x.id===id);if(i<0)return;
  pa[i].pago=Math.min(pa[i].valor,pa[i].pago+val);pa[i].metodo=met;
  pa[i].status=pa[i].pago>=pa[i].valor?'pago':pa[i].pago>0?'parcial':'pendente';
  DB.set('pagamentos',pa);closeModal();registrarLog('Pagamento registrado','Orç #'+pa[i].orc_num+' — '+brl(val)+' via '+met);toast('Pagamento registrado!');pages.pagamentos();
}

// ── USUÁRIOS ──────────────────────────────────────────
function novoUsuario(){
  openModal('Novo usuário',`
  <div class="form-row"><div class="form-group"><label>Nome</label><input id="f-nome" placeholder="Nome completo"></div>
  <div class="form-group"><label>Perfil</label><select id="f-role"><option value="funcionario">Funcionário</option><option value="admin">Administrador</option></select></div></div>
  <div class="form-row"><div class="form-group"><label>Usuário (login)</label><input id="f-usuario" placeholder="nome.sobrenome"></div>
  <div class="form-group"><label>Senha</label><input id="f-senha" type="password" placeholder="Mínimo 6 caracteres"></div></div>
  <div class="form-row single"><div class="form-group"><label>Cor do avatar</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${CORES.map((c,i)=>`<div onclick="selCor('${c}',${i})" id="cor-${i}" class="cor-opt" style="background:${c}"></div>`).join('')}</div>
  <input type="hidden" id="f-cor" value="${CORES[0]}"></div></div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
   <button class="btn btn-primary" onclick="salvarUsuario(0)">Criar usuário</button>`);
  setTimeout(()=>selCor(CORES[0],0),50);
}
function selCor(cor,idx){
  $('f-cor').value=cor;
  document.querySelectorAll('.cor-opt').forEach((el,i)=>el.style.borderColor=i===idx?'#fff':'transparent');
}
function editUsuario(id){
  const u=(DB.get('usuarios')||[]).find(x=>x.id===id);if(!u)return;
  openModal('Editar usuário',`
  <div class="form-row"><div class="form-group"><label>Nome</label><input id="f-nome" value="${u.nome}"></div>
  <div class="form-group"><label>Perfil</label><select id="f-role"><option value="funcionario"${u.role==='funcionario'?' selected':''}>Funcionário</option><option value="admin"${u.role==='admin'?' selected':''}>Administrador</option></select></div></div>
  <div class="form-row single"><div class="form-group"><label>Nova senha (deixe em branco para manter)</label><input id="f-senha" type="password" placeholder="Nova senha..."></div></div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
   <button class="btn btn-primary" onclick="salvarUsuario(${id})">Salvar</button>`);
}
function salvarUsuario(id){
  const nome=$('f-nome')?.value?.trim();if(!nome){toast('Nome obrigatório',false);return;}
  // Não permite editar usuários fixos
  if(id!==0&&USUARIOS_FIXOS.find(f=>f.id===id)){toast('Usuário do sistema não pode ser editado aqui',false);return;}
  const us=DB.get('usuarios')||[];
  if(id===0){
    const login=$('f-usuario')?.value?.trim().toLowerCase(),senha=$('f-senha')?.value;
    if(!login){toast('Usuário obrigatório',false);return;}
    if(!senha||senha.length<6){toast('Senha mínimo 6 caracteres',false);return;}
    if(us.find(x=>x.usuario===login)){toast('Usuário já existe',false);return;}
    us.push({id:Date.now(),usuario:login,senha,nome,role:$('f-role')?.value||'funcionario',cor:$('f-cor')?.value||CORES[0]});
  } else {
    const i=us.findIndex(x=>x.id===id);if(i<0)return;
    us[i].nome=nome;us[i].role=$('f-role')?.value||us[i].role;
    const ns=$('f-senha')?.value;
    if(ns&&ns.length>=6) us[i].senha=ns;
    else if(ns&&ns.length>0){toast('Senha mínimo 6 caracteres',false);return;}
  }
  DB.set('usuarios',us);closeModal();toast('Usuário salvo!');pages.usuarios();
}
function delUsuario(id){
  if(!confirm('Excluir este usuário?'))return;
  // Só remove de extras (localStorage), nunca dos fixos
  const lista=(DB.get('usuarios')||[]).filter(x=>x.id!==id);
  DB.set('usuarios',lista);
  registrarLog('Excluir usuário', String(id));
  toast('Usuário removido!');
  pages.usuarios();
}
</script>
</body>
</html>
