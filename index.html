<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SomControl — Sistema Interno</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--surface:#18181f;--surface2:#1e1e28;--surface3:#252533;
  --border:#2a2a3a;--border2:#35354a;
  --txt:#f0f0f8;--txt2:#9090b8;--txt3:#5a5a80;
  --blue:#4f8ef7;--green:#22d3a5;--amber:#f59e0b;--red:#ef4444;--purple:#a78bfa;
}
body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px}
.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:36px 32px;width:100%;max-width:360px}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .name{font-size:22px;font-weight:800;color:var(--txt);margin-bottom:4px}
.login-logo .sub{font-size:12px;color:var(--txt3)}
.login-box label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:5px}
.login-box input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--txt);font-family:inherit;outline:none;margin-bottom:14px}
.login-box input:focus{border-color:var(--blue)}
.login-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.login-btn:hover{opacity:.9}
.login-err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:14px;display:none}
#app{display:none;flex:1;overflow:hidden}
#app.visible{display:flex}
#sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
#sidebar-logo .name{font-size:15px;font-weight:800;color:var(--txt)}
#sidebar-logo .sub{font-size:11px;color:var(--txt3);margin-top:2px}
#sidebar-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--txt2);font-size:13px;font-weight:600;margin-bottom:2px;transition:all .15s}
.nav-item:hover{background:var(--surface2);color:var(--txt)}
.nav-item.active{background:var(--surface3);color:var(--blue)}
.nav-item i{font-size:17px;width:20px;text-align:center}
#sidebar-bottom{padding:12px 8px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px}
.user-av{width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:12px;font-weight:700;color:var(--txt)}
.user-role{font-size:11px;color:var(--txt3)}
.logout-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--red);font-size:12px;font-weight:600;margin-top:4px;transition:all .15s}
.logout-btn:hover{background:rgba(239,68,68,.1)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{padding:14px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-shrink:0}
#topbar h1{font-size:17px;font-weight:700;color:var(--txt)}
.top-date{font-size:12px;color:var(--txt3)}
#content{flex:1;overflow-y:auto;padding:22px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.metric-label{font-size:11px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.metric-val{font-size:24px;font-weight:800;color:var(--txt);line-height:1}
.metric-sub{font-size:11px;color:var(--txt3);margin-top:4px}
.metric-card.blue .metric-val{color:var(--blue)}
.metric-card.green .metric-val{color:var(--green)}
.metric-card.amber .metric-val{color:var(--amber)}
.metric-card.purple .metric-val{color:var(--purple)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-header h2{font-size:15px;font-weight:700;color:var(--txt)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.empty{text-align:center;padding:40px 20px;color:var(--txt3)}
.empty i{font-size:36px;margin-bottom:10px;display:block}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--surface2);color:var(--txt);border:1px solid var(--border)}.btn-secondary:hover{background:var(--surface3)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.btn-green{background:var(--green);color:#0b0b0f}
.btn-purple{background:var(--purple);color:#0b0b0f}
.btn-sm{padding:5px 10px;font-size:12px}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--surface2)}
td{padding:11px 14px;font-size:13px;color:var(--txt);border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.badge-green{background:rgba(34,211,165,.15);color:var(--green)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-blue{background:rgba(79,142,247,.15);color:var(--blue)}
.badge-gray{background:var(--surface2);color:var(--txt2)}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center}
#modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:24px;width:520px;max-width:95vw;max-height:85vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:700;margin-bottom:18px;color:var(--txt)}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
label{font-size:12px;font-weight:700;color:var(--txt2)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--txt);font-family:inherit;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:70px}
input[readonly]{opacity:.6;cursor:default}
.orc-items-list{background:var(--surface2);border-radius:8px;padding:12px;margin:8px 0}
.orc-item-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.orc-item-row:last-child{margin-bottom:0}
.remove-item{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:2px;font-family:inherit;flex-shrink:0}
.total-box{background:rgba(34,211,165,.08);border:1px solid rgba(34,211,165,.25);border-radius:8px;padding:12px 16px;margin-top:12px;text-align:right}
.total-box .tlabel{font-size:12px;color:var(--txt3);margin-bottom:2px}
.total-box .tval{font-size:22px;font-weight:800;color:var(--green)}
.cal-header-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-name{text-align:center;font-size:11px;font-weight:700;color:var(--txt3);padding:4px}
.cal-day{min-height:68px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px}
.cal-day.today{border-color:var(--blue);background:rgba(79,142,247,.06)}
.cal-day.other-month .day-num{color:var(--txt3)}
.day-num{font-size:12px;font-weight:700;margin-bottom:3px}
.cal-event{font-size:10px;border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-event.green{background:rgba(34,211,165,.2);color:var(--green)}
.cal-event.amber{background:rgba(245,158,11,.2);color:var(--amber)}
.usuarios-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.usuario-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.usuario-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;margin-bottom:10px}
.cor-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:200;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="name">🎛️ SomControl</div>
      <div class="sub">Sistema interno — acesso restrito</div>
    </div>
    <div class="login-err" id="login-err">Usuário ou senha incorretos.</div>
    <label for="inp-user">Usuário</label>
    <input id="inp-user" type="text" placeholder="seu.usuario" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
    <label for="inp-pass">Senha</label>
    <input id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
  </div>
</div>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-logo"><div class="name">SomControl</div><div class="sub">Sistema Interno</div></div>
    <nav id="sidebar-nav">
      <div class="nav-item active" onclick="go('dashboard')"><i class="ti ti-layout-dashboard"></i>Dashboard</div>
      <div class="nav-item" onclick="go('clientes')"><i class="ti ti-users"></i>Clientes</div>
      <div class="nav-item" onclick="go('equipamentos')"><i class="ti ti-device-speaker"></i>Equipamentos</div>
      <div class="nav-item" onclick="go('orcamentos')"><i class="ti ti-file-invoice"></i>Orçamentos</div>
      <div class="nav-item" onclick="go('agenda')"><i class="ti ti-calendar"></i>Agenda</div>
      <div class="nav-item" onclick="go('pagamentos')"><i class="ti ti-cash"></i>Pagamentos</div>
      <div class="nav-item" onclick="go('relatorios')"><i class="ti ti-chart-bar"></i>Relatórios</div>
      <div class="nav-item" id="nav-usuarios" style="display:none" onclick="go('usuarios')"><i class="ti ti-shield"></i>Usuários</div>
      <div class="nav-item" id="nav-log" style="display:none" onclick="go('log')"><i class="ti ti-list-search"></i>Log</div>
    </nav>
    <div id="sidebar-bottom">
      <div class="user-card">
        <div class="user-av" id="sb-av">B</div>
        <div><div class="user-name" id="sb-nome">Bruno</div><div class="user-role" id="sb-role">Admin</div></div>
      </div>
      <div class="logout-btn" onclick="doLogout()"><i class="ti ti-logout"></i>Sair</div>
    </div>
  </div>
  <div id="main">
    <div id="topbar"><h1 id="page-title">Dashboard</h1><div style="display:flex;align-items:center;gap:16px"><span id="sync-status" style="font-size:12px;color:var(--txt3)">Carregando...</span><button class="btn btn-secondary btn-sm" onclick="DB.sincronizarTudo()" title="Sincronizar com Google Sheets" style="padding:5px 10px"><i class="ti ti-refresh"></i></button><div class="top-date" id="top-date"></div></div></div>
    <div id="content"></div>
  </div>
</div>
<div id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>
<div id="toast"></div>

const GS_URL='https://script.google.com/macros/s/AKfycbzNcb1muCOuULAL5yiXM2OdU1JiwK-0Bj3-hS3otgeuH6QKo5SaOEHKr-EOnpC15osqpA/exec';
const ABAS=['clientes','equipamentos','orcamentos','pagamentos','categorias','usuarios'];

// Envia dados via iframe (contorna CORS do Apps Script)
function gsPost(aba, dados){
  return new Promise((resolve)=>{
    try{
      const arr=Array.isArray(dados)?dados:[dados];
      const serial=arr.map(item=>{
        const obj={};
        for(const[k,v] of Object.entries(item)){
          obj[k]=(typeof v==='object'&&v!==null)?JSON.stringify(v):v;
        }
        return obj;
      });
      const body=JSON.stringify({aba,acao:'salvar_tudo',dados:serial});
      // Tenta fetch normal primeiro, se falhar usa no-cors (sem resposta)
      fetch(GS_URL,{
        method:'POST',
        body,
        headers:{'Content-Type':'text/plain'} // text/plain evita preflight CORS
      })
      .then(r=>r.json())
      .then(r=>resolve({ok:true,data:r}))
      .catch(()=>{
        // Fallback: no-cors (envia mas não recebe resposta)
        fetch(GS_URL,{method:'POST',body,mode:'no-cors'})
          .then(()=>resolve({ok:true}))
          .catch(e=>resolve({ok:false,erro:e.message}));
      });
    }catch(e){resolve({ok:false,erro:e.message});}
  });
}

// Carrega dados via JSONP (contorna CORS em GET)
function gsGet(aba){
  return new Promise((resolve)=>{
    const cbName='gs_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timeout=setTimeout(()=>{
      delete window[cbName];
      script.remove();
      // Fallback: tenta fetch normal
      fetch(GS_URL+'?aba='+aba)
        .then(r=>r.json())
        .then(d=>resolve(d))
        .catch(()=>resolve(null));
    },8000);
    window[cbName]=(data)=>{
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
      resolve(data);
    };
    script.src=GS_URL+'?aba='+aba+'&callback='+cbName;
    script.onerror=()=>{
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
      resolve(null);
    };
    document.head.appendChild(script);
  });
}

const DB={
  get(k){try{return JSON.parse(localStorage.getItem('sc_'+k)||'null')}catch(e){return null}},
  set(k,v){
    localStorage.setItem('sc_'+k,JSON.stringify(v));
    if(ABAS.includes(k)){
      gsPost(k,v).catch(e=>console.warn('Sync falhou:',e));
    }
  },
  async carregarDoSheets(){
    try{
      const el=$('sync-status');
      if(el){el.textContent='Sincronizando...';el.style.color='var(--amber)';}
      let carregou=false;
      for(const aba of ABAS){
        try{
          // Categorias nunca são carregadas do Sheets — gerenciadas localmente
          if(aba==='categorias') continue;
          const dados=await gsGet(aba);
          if(Array.isArray(dados)&&dados.length>0){
            const tratados=dados.map(item=>{
              const obj={};
              for(const[k,v] of Object.entries(item)){
                if(v===''||v===null||v===undefined){obj[k]=v;continue;}
                const s=String(v).trim();
                if(s.startsWith('[')||s.startsWith('{')){
                  try{obj[k]=JSON.parse(s);}catch{obj[k]=v;}
                } else if(!isNaN(s)&&s!==''){
                  obj[k]=Number(s);
                } else {
                  obj[k]=v;
                }
              }
              return obj;
            });
            localStorage.setItem('sc_'+aba,JSON.stringify(tratados));
            carregou=true;
          }
        }catch(e){console.warn('Erro ao carregar '+aba,e);}
      }
      if(el){
        el.textContent=carregou?'✓ Sincronizado':'✓ Local';
        el.style.color='var(--green)';
      }
    }catch(e){
      const el=$('sync-status');
      if(el){el.textContent='✓ Local';el.style.color='var(--txt3)';}
    }
  },
  async sincronizarTudo(){
    try{
      const el=$('sync-status');
      if(el){el.textContent='Salvando...';el.style.color='var(--amber)';}
      for(const aba of ABAS){
        if(aba==='categorias'){
          // Categorias: converter de array de strings para array de objetos
          const cats=getCats();
          const comoObjetos=cats.map(cat=>({categoria:cat}));
          await gsPost(aba,comoObjetos);
          continue;
        }
        const dados=this.get(aba);
        if(dados) await gsPost(aba,dados);
      }
      if(el){el.textContent='✓ Salvo';el.style.color='var(--green)';}
      toast('Dados sincronizados!');
    }catch(e){
      toast('Erro ao sincronizar',false);
    }
  },
  init(){
    // Usuários gerenciados pelo painel — localStorage é opcional
    // Os USUARIOS_FIXOS garantem acesso mesmo sem localStorage
    // Garantir que categorias seja sempre array de strings completas
    const catsRaw = localStorage.getItem('sc_categorias');
    const CATS_PADRAO = ['Caixa Ativa','Subwoofer','Mesa de Som','Microfone','Amplificador','Cabo','Outro'];
    if(!catsRaw){
      localStorage.setItem('sc_categorias', JSON.stringify(CATS_PADRAO));
    } else {
      try {
        const parsed = JSON.parse(catsRaw);
        // Detectar se está corrompido: itens muito curtos ou são objetos de 1 char
        const corrompido = !Array.isArray(parsed) || 
          (parsed.length > 0 && parsed.filter(x => {
            const s = typeof x === 'string' ? x : (x && typeof x === 'object' ? Object.values(x).join('') : String(x));
            return s.length <= 2;
          }).length > parsed.length / 2);
        if(corrompido){
          console.warn('Categorias corrompidas detectadas, resetando...');
          localStorage.setItem('sc_categorias', JSON.stringify(CATS_PADRAO));
        }
      } catch(e) {
        localStorage.setItem('sc_categorias', JSON.stringify(CATS_PADRAO));
      }
    }
  }
};

// ── SISTEMA DE LOG ──────────────────────────────────────
function registrarLog(acao, detalhes=''){
  try {
    const logs = JSON.parse(localStorage.getItem('sc_logs')||'[]');
    const entrada = {
      id: Date.now(),
      data: new Date().toLocaleDateString('pt-BR'),
      hora: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit',second:'2-digit'}),
      usuario: currentUser ? currentUser.nome : 'Sistema',
      acao,
      detalhes: String(detalhes||'')
    };
    logs.unshift(entrada); // mais recente primeiro
    // Manter só os últimos 500 registros
    if(logs.length > 500) logs.splice(500);
    localStorage.setItem('sc_logs', JSON.stringify(logs));
  } catch(e) { console.warn('Erro ao registrar log:', e); }
}

// ══════════════════════════════════════════════════════
function gerarPDF(orc, interno=false){
  try{
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,ML=15,MR=15,CW=W-ML-MR;
  let y=12;

  // Helper: garante string segura
  const ss=v=>String(v==null?'':v);
  // Helper: garante número seguro
  const nn=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};

  const linha=(y1)=>{doc.setDrawColor(0);doc.setLineWidth(0.4);doc.line(ML,y1,W-MR,y1);};

  const txt=(text,x,yw,opts={})=>{
    const safeText=ss(text);
    doc.setFontSize(opts.size||9);
    doc.setFont('helvetica',opts.bold?'bold':'normal');
    const col=opts.color||[0,0,0];
    doc.setTextColor(col[0],col[1],col[2]);
    doc.text(safeText,x,yw,{align:opts.align||'left',maxWidth:opts.maxW||undefined});
  };

  // LOGO
  try{doc.addImage(LOGO_B64,'PNG',ML,y,22,22);}catch(e){console.warn('Logo erro:',e);}

  // CABEÇALHO
  const rx=W-MR;
  txt('11 97409-0130',rx,y+5,{bold:true,align:'right',size:10});
  txt('CONTATOINCAAUDIO@GMAIL.COM',rx,y+10,{align:'right',size:8,color:[80,80,80]});
  txt('GUT SOLUÇÕES EM AUDIO LTDA',rx,y+16,{bold:true,align:'right',size:9});
  txt('CNPJ: 14.709.564/0001-02',rx,y+21,{align:'right',size:8,color:[80,80,80]});
  y+=27;
  linha(y);y+=6;

  // DATA
  const hoje=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  txt('São Paulo, '+hoje,ML,y,{size:9});y+=7;

  // TÍTULO + VALIDADE
  txt('PROPOSTA DE ORÇAMENTO',ML,y,{bold:true,size:15});
  const dataRet=orc.data_ret||orc.data_retorno||'';
  const valDate=dataRet?new Date(dataRet+'T12:00'):new Date(Date.now()+7*86400000);
  const val=valDate.toLocaleDateString('pt-BR');
  txt('Validade: '+val,rx,y,{bold:true,size:10,align:'right'});
  y+=8;

  // BLOCO CLIENTE / EVENTO
  const bh=7,bp=2;
  const cols=[38,62,22,CW-38-62-22];

  function cabRow(labels,y0,bg){
    let xx=ML;
    labels.forEach((l,i)=>{
      if(bg){doc.setFillColor(bg[0],bg[1],bg[2]);doc.rect(xx,y0,cols[i],bh,'F');}
      doc.setDrawColor(180);doc.setLineWidth(0.3);doc.rect(xx,y0,cols[i],bh,'S');
      txt(ss(l),xx+bp,y0+5,{bold:true,size:8});
      xx+=cols[i];
    });
  }
  function dataRow(vals,y0){
    let xx=ML;
    vals.forEach((v,i)=>{
      doc.setDrawColor(180);doc.setLineWidth(0.3);doc.rect(xx,y0,cols[i],bh,'S');
      if(v) txt(ss(v),xx+bp,y0+5,{size:8,maxW:cols[i]-bp*2});
      xx+=cols[i];
    });
  }

  // Dados do cliente com fallbacks
  const nomeCliente=ss(orc.cliente||orc.nome_cliente||'');
  const periodoEvento=ss(orc.evento_periodo||((orc.data_evento?fmtD(orc.data_evento):'')+
    (orc.data_ret?' a '+fmtD(orc.data_ret):'')));
  const localEvento=ss(orc.local||orc.local_evento||'');
  const cnpjCliente=ss(orc.cliente_cnpj||'');
  const emailCliente=ss(orc.cliente_email||'');
  const telCliente=ss(orc.cliente_tel||'');
  const formaPag=ss(orc.forma_pagamento||'Depósito Bancário 50% antes, 50% após o evento.');

  cabRow(['CLIENTE','','EVENTO',''],y,[242,242,242]);y+=bh;
  dataRow(['Nome:',nomeCliente,'Período:',periodoEvento],y);y+=bh;
  dataRow(['CNPJ / CPF',cnpjCliente,'Local:',localEvento],y);y+=bh;

  // forma de pagamento
  doc.setDrawColor(180);doc.setLineWidth(0.3);
  doc.rect(ML,y,cols[0],bh,'S');txt('Forma de Pagamento',ML+bp,y+5,{bold:true,size:8});
  doc.rect(ML+cols[0],y,cols[1]+cols[2]+cols[3],bh,'S');
  txt(formaPag,ML+cols[0]+bp,y+5,{size:8,maxW:cols[1]+cols[2]+cols[3]-bp*2});
  y+=bh;
  dataRow(['Email:',emailCliente,'',''],y);y+=bh;
  dataRow(['Telefone:',telCliente,'',''],y);y+=bh+5;

  // TABELA MATERIAL
  const mh=6;
  doc.setFillColor(242,242,242);doc.rect(ML,y,CW,mh,'F');
  doc.setDrawColor(180);doc.rect(ML,y,CW,mh,'S');
  txt('MATERIAL',ML+bp,y+4,{bold:true,size:8});y+=mh;

  const itens=Array.isArray(orc.itens)?orc.itens:[];
  let total_parcial=0;

  if(interno){
    const mc=[CW-18-22-30-32,18,22,30,32];
    const mx=[ML,ML+mc[0],ML+mc[0]+mc[1],ML+mc[0]+mc[1]+mc[2],ML+mc[0]+mc[1]+mc[2]+mc[3]];
    doc.setFillColor(242,242,242);
    mc.forEach((w,i)=>{doc.rect(mx[i],y,w,mh,'F');doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
    txt('Produto',mx[0]+bp,y+4,{bold:true,size:8});
    txt('Qtd.',mx[1]+bp,y+4,{bold:true,size:8});
    txt('Diárias',mx[2]+bp,y+4,{bold:true,size:8});
    txt('Unitário',mx[3]+bp,y+4,{bold:true,size:8});
    txt('Subtotal',mx[4]+bp,y+4,{bold:true,size:8});
    y+=mh;
    itens.forEach(it=>{
      const qtd=nn(it.qtd),dias=nn(it.diarias||1),unit=nn(it.unitario||it.diaria||0);
      const sub=qtd*dias*unit;total_parcial+=sub;
      mc.forEach((w,i)=>{doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
      txt(ss(it.nome),mx[0]+bp,y+4,{size:8,maxW:mc[0]-bp*2});
      txt(ss(qtd),mx[1]+mc[1]/2,y+4,{size:8,align:'center'});
      txt(ss(dias),mx[2]+mc[2]/2,y+4,{size:8,align:'center'});
      txt(brl(unit),mx[3]+mc[3]-bp,y+4,{size:8,align:'right'});
      txt(brl(sub),mx[4]+mc[4]-bp,y+4,{size:8,align:'right'});
      y+=mh;
    });
    mc.forEach((w,i)=>{doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
    txt('TOTAL PARCIAL',mx[0]+bp,y+4,{bold:true,size:8});
    txt(brl(total_parcial),mx[4]+mc[4]-bp,y+4,{bold:true,size:8,align:'right'});
    y+=mh;
  } else {
    const mc=[CW-25-30,25,30];
    const mx=[ML,ML+mc[0],ML+mc[0]+mc[1]];
    doc.setFillColor(242,242,242);
    mc.forEach((w,i)=>{doc.rect(mx[i],y,w,mh,'F');doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
    txt('Produto',mx[0]+bp,y+4,{bold:true,size:8});
    txt('Qtd.',mx[1]+bp,y+4,{bold:true,size:8});
    txt('Diárias',mx[2]+bp,y+4,{bold:true,size:8});
    y+=mh;
    itens.forEach(it=>{
      const qtd=nn(it.qtd),dias=nn(it.diarias||1),unit=nn(it.unitario||it.diaria||0);
      total_parcial+=qtd*dias*unit;
      mc.forEach((w,i)=>{doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
      txt(ss(it.nome),mx[0]+bp,y+4,{size:8,maxW:mc[0]-bp*2});
      txt(ss(qtd),mx[1]+mc[1]/2,y+4,{size:8,align:'center'});
      txt(ss(dias),mx[2]+mc[2]/2,y+4,{size:8,align:'center'});
      y+=mh;
    });
    mc.forEach((w,i)=>{doc.setDrawColor(180);doc.rect(mx[i],y,w,mh,'S');});
    txt('TOTAL PARCIAL',mx[0]+bp,y+4,{bold:true,size:8});
    y+=mh;
  }

  y+=5;

  // RESUMO FINAL
  const rcol1=CW-40,rcol2=40;
  const frete=nn(orc.frete);
  const servico=nn(orc.servico);
  const desconto=nn(orc.desconto);
  const total=nn(orc.total)||total_parcial+frete;
  const material=total-frete-servico+desconto;

  const rrows=[
    ['MATERIAL',brl(material>0?material:total_parcial)],
    ['FRETE TOTAL',brl(frete)],
    ['SERVIÇO',servico?brl(servico):''],
    ['DESCONTO',desconto?brl(desconto):''],
  ];
  rrows.forEach(([l,v])=>{
    doc.setDrawColor(180);
    doc.rect(ML,y,rcol1,mh,'S');doc.rect(ML+rcol1,y,rcol2,mh,'S');
    txt(l,ML+bp,y+4,{bold:true,size:8});
    txt(v,ML+rcol1+rcol2-bp,y+4,{bold:true,size:8,align:'right'});
    y+=mh;
  });
  // TOTAL verde
  doc.setFillColor(76,175,80);doc.rect(ML,y,CW,mh,'F');
  doc.setDrawColor(180);doc.rect(ML,y,rcol1,mh,'S');doc.rect(ML+rcol1,y,rcol2,mh,'S');
  txt('TOTAL',ML+bp,y+4,{bold:true,size:8,color:[255,255,255]});
  txt(brl(total),ML+CW-bp,y+4,{bold:true,size:8,color:[255,255,255],align:'right'});
  y+=mh+10;

  // TERMOS
  const termos='TERMOS CONTRATUAIS: A locatária se responsabiliza pelas eventuais perdas e danos causados ao equipamento, devido ao mau uso de seus operadores e/ou exposição a condições adversas de umidade e temperatura. Incluindo caso fortuito ou força maior.';
  doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(80,80,80);
  const lines=doc.splitTextToSize(termos,CW);
  doc.text(lines,W/2,y,{align:'center'});
  y+=lines.length*4+10;

  // ASSINATURA
  const ax=W/2;
  doc.setDrawColor(0);doc.setLineWidth(0.3);doc.line(ax-30,y,ax+30,y);
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(80,80,80);
  doc.text('Assinatura',ax,y+5,{align:'center'});

  const nomeArq=interno?`INTERNO_Orcamento_${ss(orc.num)}.pdf`:`Orcamento_${ss(orc.num)}_INCA.pdf`;
  doc.save(nomeArq);
  }catch(err){
    console.error('Erro gerarPDF:',err);
    toast('Erro ao gerar PDF: '+err.message,false);
  }
}

agenda(){
  const or=DB.get('orcamentos')||[];

    evento_periodo: (o.data_evento?fmtD(o.data_evento):'')+(o.data_ret?' a '+fmtD(o.data_ret):''),

  };

function getCats(){
  // Lê direto do localStorage para evitar qualquer conversão
  try {
    const raw = localStorage.getItem('sc_categorias');
    if(!raw) return ['Caixa Ativa','Subwoofer','Mesa de Som','Microfone','Amplificador','Cabo','Outro'];
    const parsed = JSON.parse(raw);
    // Se for array de strings — caso normal
    if(Array.isArray(parsed)){
      return parsed.map(x=>{
        if(typeof x==='string') return x.trim();
        if(typeof x==='object'&&x!==null){
          // vindo do Sheets como {categoria:'Caixa Ativa'}
          return x.categoria||Object.values(x).find(v=>v&&typeof v==='string')||'';
        }
        return String(x).trim();
      }).filter(x=>x.length>0);
    }
    // Se for string simples
    if(typeof parsed==='string'){
      return parsed.split(',').map(x=>x.trim()).filter(x=>x);
    }
    return ['Caixa Ativa','Subwoofer','Mesa de Som','Microfone','Amplificador','Cabo','Outro'];
  } catch(e) {
    return ['Caixa Ativa','Subwoofer','Mesa de Som','Microfone','Amplificador','Cabo','Outro'];
  }
}
function saveCats(arr){
  // Salva como array de strings no localStorage
  const limpo = arr.map(x=>String(x).trim()).filter(x=>x.length>0);
  localStorage.setItem('sc_categorias', JSON.stringify(limpo));
  // Sincroniza com Sheets convertendo para array de objetos
  const comoObjetos = limpo.map(cat => ({categoria: cat}));
  gsPost('categorias', comoObjetos).catch(e=>console.warn('Sync cats:',e));
}

  const cats=getCats();

}
function removeItemOrc(i){orcItens.splice(i,1);renderOrcItens();}
function renderOrcItens(){
  const prev=$('orc-items-preview'),totEl=$('orc-total');if(!prev)return;
  const d1=$('f-data')?.value,d2=$('f-ret')?.value;
  const dias=(d1&&d2)?Math.max(1,Math.round((new Date(d2)-new Date(d1))/86400000)):1;
  // atualiza diárias de todos os itens
  orcItens.forEach(i=>i.diarias=dias);
  const frete=parseFloat($('f-frete')?.value||0);
  const sub=orcItens.reduce((s,i)=>s+i.qtd*i.diarias*i.unitario,0);
  if(!orcItens.length){prev.innerHTML=`<div class="empty" style="padding:16px 0"><i class="ti ti-package"></i><p>Nenhum item ainda</p></div>`;if(totEl)totEl.style.display='none';return;}
  prev.innerHTML=`<div class="orc-items-list">${orcItens.map((it,idx)=>`
    <div class="orc-item-row">
      <span style="flex:1;font-size:13px">${it.nome}</span>
      <span style="color:var(--txt3);font-size:12px">${it.qtd}x ${dias} dia(s)</span>
      <span style="color:var(--blue);font-size:12px;min-width:70px;text-align:right">${brl(it.qtd*it.diarias*it.unitario)}</span>
      <button class="remove-item" onclick="removeItemOrc(${idx})"><i class="ti ti-x"></i></button>
    </div>`).join('')}</div>`;
  if(totEl){totEl.style.display='block';$('orc-total-val').textContent=brl(sub+frete);}
}
function salvarOrc(){
  const cl=DB.get('clientes')||[];
  const cid=parseInt($('f-cli')?.value);const cli=cl.find(c=>c.id===cid);
  const ev=$('f-evento')?.value?.trim(),d1=$('f-data')?.value,d2=$('f-ret')?.value;
  if(!cli||!ev||!d1||!d2){toast('Preencha todos os campos',false);return;}
  if(!orcItens.length){toast('Adicione pelo menos um item',false);return;}
  const dias=Math.max(1,Math.round((new Date(d2)-new Date(d1))/86400000));
  orcItens.forEach(i=>i.diarias=dias);
  const frete=parseFloat($('f-frete')?.value||0);
  const total=orcItens.reduce((s,i)=>s+i.qtd*i.diarias*i.unitario,0)+frete;
  const or=DB.get('orcamentos')||[];
  const num=String(or.length+1).padStart(4,'0');
  const novo={id:Date.now(),num,cliente_id:cid,cliente:cli.nome,evento:ev,data_evento:d1,data_ret:d2,
    local:$('f-local')?.value||'',itens:orcItens.map(i=>({nome:i.nome,qtd:i.qtd,diarias:i.diarias,unitario:i.unitario})),
    frete,servico:0,desconto:0,total,status:'pendente',
    criado:new Date().toISOString().split('T')[0],criado_por:currentUser?.nome||''};
  or.push(novo);DB.set('orcamentos',or);
  const pa=DB.get('pagamentos')||[];
  pa.push({id:Date.now(),orc_num:num,cliente:cli.nome,valor:total,pago:0,metodo:'',status:'pendente',data:novo.criado});
  DB.set('pagamentos',pa);
  closeModal();toast('Orçamento #'+num+' criado!');registrarLog('Novo orçamento', '#'+num+' — '+cli.nome+' — '+brl(total));pages.orcamentos();
}
function verOrc(id){
  const o=(DB.get('orcamentos')||[]).find(x=>x.id===id);if(!o)return;
  openModal(`Orçamento #${o.num}`,`
  <div class="form-row"><div class="form-group"><label>Cliente</label><input value="${o.cliente}" readonly></div>
  <div class="form-group"><label>Status</label>
  <select id="f-st" onchange="updateStatusOrc(${o.id},this.value)">
    ${['pendente','aprovado','cancelado'].map(s=>`<option${o.status===s?' selected':''}>${s}</option>`).join('')}
  </select></div></div>
  <div class="form-row"><div class="form-group"><label>Evento</label><input value="${o.evento}" readonly></div>
  <div class="form-group"><label>Data</label><input value="${o.data_evento?fmtD(o.data_evento):''}" readonly></div></div>
  <div class="form-row single"><div class="form-group"><label>Local</label><input value="${o.local}" readonly></div></div>
  <label style="font-size:12px;color:var(--txt3);font-weight:700;display:block;margin-top:12px;margin-bottom:6px">Itens</label>
  <div class="orc-items-list">${(o.itens||[]).map(i=>`
    <div class="orc-item-row">
      <span style="flex:1">${i.nome}</span>
      <span style="color:var(--txt3)">${i.qtd}x ${i.diarias} dia(s)</span>
      <span style="color:var(--blue);min-width:80px;text-align:right">${brl(i.qtd*i.diarias*i.unitario)}</span>
    </div>`).join('')}</div>
  <div class="total-box"><div class="tlabel">Total</div><div class="tval">${brl(o.total)}</div></div>
  ${o.criado_por?`<div style="font-size:11px;color:var(--txt3);margin-top:10px">Criado por: ${o.criado_por}</div>`:''}
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn btn-green" style="flex:1" onclick="closeModal();baixarPDF(${o.id},false)"><i class="ti ti-file-download"></i>PDF Cliente</button>
    <button class="btn btn-purple" style="flex:1" onclick="closeModal();baixarPDF(${o.id},true)"><i class="ti ti-file-invoice"></i>PDF Interno</button>
  </div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Fechar</button>`);
}
function updateStatusOrc(id,st){
  const or=DB.get('orcamentos')||[];const i=or.findIndex(x=>x.id===id);
  if(i>=0){or[i].status=st;DB.set('orcamentos',or);registrarLog('Status orçamento','#'+(or[i].num||id)+' → '+st);toast('Status atualizado!');}
}
function delOrc(id){
  if(!confirm('Excluir orçamento?'))return;
  const orc_del=(DB.get('orcamentos')||[]).find(x=>x.id===id);
  DB.set('orcamentos',(DB.get('orcamentos')||[]).filter(x=>x.id!==id));
  registrarLog('Excluir orçamento','#'+(orc_del?.num||id)+' — '+(orc_del?.cliente||''));
  toast('Removido!');pages.orcamentos();
}

// ── PAGAMENTOS ────────────────────────────────────────
function registrarPag(id){
  const p=(DB.get('pagamentos')||[]).find(x=>x.id===id);if(!p)return;
  openModal(`Pagamento — #${p.orc_num}`,`
  <div style="background:var(--surface2);border-radius:8px;padding:14px;margin-bottom:14px;font-size:13px">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--txt3)">Total</span><strong>${brl(p.valor)}</strong></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--txt3)">Já pago</span><strong style="color:var(--green)">${brl(p.pago)}</strong></div>
    <div style="display:flex;justify-content:space-between"><span style="color:var(--txt3)">Restante</span><strong style="color:var(--amber)">${brl(p.valor-p.pago)}</strong></div>
  </div>
  <div class="form-row"><div class="form-group"><label>Valor recebido agora (R$)</label>
    <input id="f-vp" type="number" value="${(p.valor-p.pago).toFixed(2)}" min="0">
  </div><div class="form-group"><label>Forma de pagamento</label>
    <select id="f-met"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option></select>
  </div></div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
   <button class="btn btn-green" onclick="salvarPag(${id})"><i class="ti ti-check"></i>Registrar</button>`);
}
function salvarPag(id){
  const val=parseFloat($('f-vp')?.value||0),met=$('f-met')?.value;
  const pa=DB.get('pagamentos')||[];const i=pa.findIndex(x=>x.id===id);if(i<0)return;
  pa[i].pago=Math.min(pa[i].valor,pa[i].pago+val);pa[i].metodo=met;
  pa[i].status=pa[i].pago>=pa[i].valor?'pago':pa[i].pago>0?'parcial':'pendente';
  DB.set('pagamentos',pa);closeModal();registrarLog('Pagamento registrado','Orç #'+pa[i].orc_num+' — '+brl(val)+' via '+met);toast('Pagamento registrado!');pages.pagamentos();
}

// ── USUÁRIOS ──────────────────────────────────────────
function novoUsuario(){
  openModal('Novo usuário',`
  <div class="form-row"><div class="form-group"><label>Nome</label><input id="f-nome" placeholder="Nome completo"></div>
  <div class="form-group"><label>Perfil</label><select id="f-role"><option value="funcionario">Funcionário</option><option value="admin">Administrador</option></select></div></div>
  <div class="form-row"><div class="form-group"><label>Usuário (login)</label><input id="f-usuario" placeholder="nome.sobrenome"></div>
  <div class="form-group"><label>Senha</label><input id="f-senha" type="password" placeholder="Mínimo 6 caracteres"></div></div>
  <div class="form-row single"><div class="form-group"><label>Cor do avatar</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${CORES.map((c,i)=>`<div onclick="selCor('${c}',${i})" id="cor-${i}" class="cor-opt" style="background:${c}"></div>`).join('')}</div>
  <input type="hidden" id="f-cor" value="${CORES[0]}"></div></div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
   <button class="btn btn-primary" onclick="salvarUsuario(0)">Criar usuário</button>`);
  setTimeout(()=>selCor(CORES[0],0),50);
}
function selCor(cor,idx){
  $('f-cor').value=cor;
  document.querySelectorAll('.cor-opt').forEach((el,i)=>el.style.borderColor=i===idx?'#fff':'transparent');
}
function editUsuario(id){
  const u=(DB.get('usuarios')||[]).find(x=>x.id===id);if(!u)return;
  openModal('Editar usuário',`
  <div class="form-row"><div class="form-group"><label>Nome</label><input id="f-nome" value="${u.nome}"></div>
  <div class="form-group"><label>Perfil</label><select id="f-role"><option value="funcionario"${u.role==='funcionario'?' selected':''}>Funcionário</option><option value="admin"${u.role==='admin'?' selected':''}>Administrador</option></select></div></div>
  <div class="form-row single"><div class="form-group"><label>Nova senha (deixe em branco para manter)</label><input id="f-senha" type="password" placeholder="Nova senha..."></div></div>`,
  `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
   <button class="btn btn-primary" onclick="salvarUsuario(${id})">Salvar</button>`);
}
function salvarUsuario(id){
  const nome=$('f-nome')?.value?.trim();if(!nome){toast('Nome obrigatório',false);return;}
  // Não permite editar usuários fixos
  if(id!==0&&USUARIOS_FIXOS.find(f=>f.id===id)){toast('Usuário do sistema não pode ser editado aqui',false);return;}
  const us=DB.get('usuarios')||[];
  if(id===0){
    const login=$('f-usuario')?.value?.trim().toLowerCase(),senha=$('f-senha')?.value;
    if(!login){toast('Usuário obrigatório',false);return;}
    if(!senha||senha.length<6){toast('Senha mínimo 6 caracteres',false);return;}
    if(us.find(x=>x.usuario===login)){toast('Usuário já existe',false);return;}
    us.push({id:Date.now(),usuario:login,senha,nome,role:$('f-role')?.value||'funcionario',cor:$('f-cor')?.value||CORES[0]});
  } else {
    const i=us.findIndex(x=>x.id===id);if(i<0)return;
    us[i].nome=nome;us[i].role=$('f-role')?.value||us[i].role;
    const ns=$('f-senha')?.value;
    if(ns&&ns.length>=6) us[i].senha=ns;
    else if(ns&&ns.length>0){toast('Senha mínimo 6 caracteres',false);return;}
  }
  DB.set('usuarios',us);closeModal();toast('Usuário salvo!');pages.usuarios();
}
function delUsuario(id){
  if(!confirm('Excluir este usuário?'))return;
  // Só remove de extras (localStorage), nunca dos fixos
  const lista=(DB.get('usuarios')||[]).filter(x=>x.id!==id);
  DB.set('usuarios',lista);
  registrarLog('Excluir usuário', String(id));
  toast('Usuário removido!');
  pages.usuarios();
}
</script>
</body>
</html>
